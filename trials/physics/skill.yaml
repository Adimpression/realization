  \ = '( ( drive ) / ( opposition ) )'\nOUTPUT_FIELD = 'response'\nALLOWED_NAMES =\
  \ ['drive', 'opposition']\nALLOWED_NODE_TYPES = (\n    ast.Expression,\n    ast.BinOp,\n\
  \    ast.UnaryOp,\n    ast.Attribute,\n    ast.Add,\n    ast.Sub,\n    ast.Mult,\n\
  \    ast.Div,\n    ast.Pow,\n    ast.Mod,\n    ast.FloorDiv,\n    ast.USub,\n  \
  \  ast.UAdd,\n    ast.Load,\n    ast.Name,\n    ast.Constant,\n)\n\n\nclass InputPayload(msgspec.Struct,\
  \ kw_only=True):\n    payload: dict[str, object] = {}\n\n\nclass OutputPayload(msgspec.Struct,\
  \ kw_only=True):\n    status: str\n    answer: str = \"\"\n    result: dict[str,\
