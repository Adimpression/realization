python: "# /// script\n# requires-python = \">=3.11\"\n# dependencies = [\"msgspec\"\
  , \"orjson\"]\n# ///\n\nfrom __future__ import annotations\n\nimport argparse\n\
  import ast\nimport math\nimport sys\n\nimport msgspec\nimport orjson\n\n\nEXPRESSION\
  \ = 'E_ * ( initial ) + Delta * E'\nOUTPUT_FIELD = 'E_times_final'\nALLOWED_NAMES\
  \ = ['E_', 'initial', 'Delta']\nALLOWED_NODE_TYPES = (\n    ast.Expression,\n  \
  \  ast.BinOp,\n    ast.UnaryOp,\n    ast.Attribute,\n    ast.Add,\n    ast.Sub,\n\
  \    ast.Mult,\n    ast.Div,\n    ast.Pow,\n    ast.Mod,\n    ast.FloorDiv,\n  \
  \  ast.USub,\n    ast.UAdd,\n    ast.Load,\n    ast.Name,\n    ast.Constant,\n)\n\
  \n\nclass InputPayload(msgspec.Struct, kw_only=True):\n    payload: dict[str, object]\
  \ = {}\n\n\nclass OutputPayload(msgspec.Struct, kw_only=True):\n    status: str\n\
  \    answer: str = \"\"\n    result: dict[str, object]\n    notes: list[str] = []\n\
  \n\ndef _validate_expression() -> ast.AST:\n    tree = ast.parse(EXPRESSION, mode=\"\
  eval\")\n    for node in ast.walk(tree):\n        if not isinstance(node, ALLOWED_NODE_TYPES):\n\
  \            raise ValueError(f\"disallowed expression node: {type(node).__name__}\"\
  )\n        if isinstance(node, ast.Attribute):\n            if not (\n         \
  \       isinstance(node.value, ast.Name)\n                and node.value.id == \"\
  math\"\n                and node.attr in ('pi', 'e')\n            ):\n         \
  \       raise ValueError(f\"disallowed attribute access: {ast.unparse(node)}\")\n\
  \        if isinstance(node, ast.Name) and node.id not in ALLOWED_NAMES:\n     \
  \       if node.id == \"math\":\n                continue\n            raise ValueError(f\"\
  disallowed symbol: {node.id}\")\n    return tree\n\n\nCOMPILED = compile(_validate_expression(),\
  \ \"<expression>\", \"eval\")\n\n\ndef _coerce_number(value: object) -> float:\n\
  \    if value is None:\n        raise ValueError(\"missing numeric input\")\n  \
  \  if isinstance(value, bool):\n        raise ValueError(\"boolean inputs are not\
  \ numeric\")\n    if isinstance(value, (int, float)):\n        return float(value)\n\
  \    text = str(value).strip()\n    if not text:\n        raise ValueError(\"empty\
  \ numeric input\")\n    return float(text)\n\n\ndef run(payload: InputPayload) ->\
  \ OutputPayload:\n    values = {\n    \"E_\": _coerce_number(payload.payload.get(\"\
  E_\")),\n    \"initial\": _coerce_number(payload.payload.get(\"initial\")),\n  \
  \  \"Delta\": _coerce_number(payload.payload.get(\"Delta\")),\n    }\n    result\
  \ = eval(COMPILED, {\"__builtins__\": {}, \"math\": math}, values)\n    normalized\
  \ = int(result) if isinstance(result, float) and result.is_integer() else result\n\
  \    return OutputPayload(\n        status=\"ok\",\n        answer=str(normalized),\n\
  \        result={OUTPUT_FIELD: normalized},\n        notes=[],\n    )\n\n\ndef main()\
  \ -> None:\n    parser = argparse.ArgumentParser(description='Physics Relations\
  \ \u2014 Work and Energy Transfer / Python Ability')\n    parser.add_argument(\"\
  --input-json\", help=\"Optional JSON payload. Prefer stdin when omitted.\")\n  \
  \  args = parser.parse_args()\n    raw = args.input_json.encode(\"utf-8\") if args.input_json\
  \ else sys.stdin.buffer.read()\n    payload = orjson.loads(raw) if raw else {}\n\
  \    typed_input = msgspec.convert({\"payload\": payload}, type=InputPayload)\n\
  \    result = run(typed_input)\n    sys.stdout.buffer.write(orjson.dumps(msgspec.to_builtins(result),\
  \ option=orjson.OPT_INDENT_2))\n    sys.stdout.buffer.write(b\"\\n\")\n\n\nif __name__\
  \ == \"__main__\":\n    main()"
