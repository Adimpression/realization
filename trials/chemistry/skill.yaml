question: How do you calculate Y from a, b, s, d?
declaration:
  intent: How do you calculate Y from a, b, s, d?
  inputs:
    a: number
    b: number
    s: number
    d: number
  outputs:
    Y: number
  authorities_requested:
  - execute
  authority_bounds:
    execute:
      scope: local_executor
