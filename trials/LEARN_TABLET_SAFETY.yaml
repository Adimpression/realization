3. One label is visible but the rest are still uncertain:
  Description:
  - The markdown document contains a bounded section that directly states this knowledge
    unit.
  - 'Knowledge artifact for: I have 3 tablets in my hand, 10 mg or 100 mg and the
    other has the mg on the label. Should I take one?'
  In:
  - Tablet Safety And Immediate Next Steps
  - Have 3 Tablet My Hand 10 Mg Or 100 Mg
  - Other Has Mg Label Should Take One
  Out:
  - Knowing the strength of one tablet is not enough if the remaining loose tablets
    are still uncertain and you cannot match each tablet confidently. If the choice
    is still ambiguous, do not take one just because one label is visible somewhere.
    no, not until you can match the exact tablet you plan to take to the correct label
    and directions
