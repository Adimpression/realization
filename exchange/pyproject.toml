[project]
name = "realized-exchange"
version = "0.1.0"
description = "Artifact and portable-skill exchange adapters for Realized."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Ravindranath Akila" }]
maintainers = [{ name = "Adimpression", email = "talktome@adimpression.mobi" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["artifacts", "exchange", "skills", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml==6.0.3",
    "realized-core-engine==0.1.0",
    "realized-core-governance==0.1.0",
    "realized-core-runtime==0.1.0",
    "realized-core-semantics==0.1.0",
    "realized-skill-application==0.1.0",
    "realized-skill-semantics==0.1.0",
    "realized-workstation-subject-core==0.1.0",
    "realized-workstation-subject-service==0.1.0",
]

[project.urls]
Homepage = "https://github.com/Adimpression/realization"
Repository = "https://github.com/Adimpression/realization"
Issues = "https://github.com/Adimpression/realization/issues"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["realized_exchange"]

[tool.setuptools.package-data]
realized_exchange = ["py.typed"]

[tool.uv.sources]
realized-core-engine = { workspace = true }
realized-core-governance = { workspace = true }
realized-core-runtime = { workspace = true }
realized-core-semantics = { workspace = true }
realized-skill-application = { workspace = true }
realized-skill-semantics = { workspace = true }
realized-workstation-subject-core = { workspace = true }
realized-workstation-subject-service = { workspace = true }
