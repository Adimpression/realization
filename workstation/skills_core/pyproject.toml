[project]
name = "realized-workstation-skills-core"
version = "0.1.0"
description = "Workstation core skill execution package for Realized."
requires-python = ">=3.14"
dependencies = [
    "realized-core-governance==0.1.0",
    "realized-skill-semantics==0.1.0",
    "realized-host-interaction",
    "realized-workstation",
    "realized-workstation-contracts",
    "realized-workstation-foundation-host",
    "realized-workstation-foundation-models",
    "realized-workstation-skills-builtin",
]

[tool.uv.sources]
realized-core-governance = { workspace = true }
realized-skill-semantics = { workspace = true }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.skills.core"]
namespaces = true
