[project]
name = "realized-workstation-shell-core"
version = "0.1.0"
description = "Workstation shell runtime package for Realized."
requires-python = ">=3.14"
dependencies = [
    "realized-core-conversation==0.1.0",
    "realized-core-llm==0.1.0",
    "realized-core-semantics==0.1.0",
    "realized-workstation",
    "realized-workstation-contracts",
    "realized-workstation-foundation-events",
    "realized-workstation-foundation-models",
    "realized-workstation-foundation-projections",
    "realized-workstation-grpc-definitions",
    "realized-workstation-runtime-core",
    "realized-workstation-skills-core",
    "realized-workstation-subject-service",
    "grpcio>=1.80.0",
]

[tool.uv.sources]
realized-core-conversation = { workspace = true }
realized-core-llm = { workspace = true }
realized-core-semantics = { workspace = true }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.shell.core"]
namespaces = true
