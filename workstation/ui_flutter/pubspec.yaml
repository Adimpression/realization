name: workstation_ui
description: "Material 3 workstation client backed by the shared gRPC contract."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.2
  fixnum: ^1.1.1
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  grpc: ^4.3.0
  protobuf: ^5.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/workstation_layout.json
    - assets/integration/city_bus_ticketing_modernization.md
