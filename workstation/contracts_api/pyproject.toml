[project]
name = "realized-workstation-contracts"
version = "0.1.0"
description = "Stable internal workstation API and ABI contracts for Realized."
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.contracts"]
namespaces = true
