[project]
name = "realized-workstation-runtime-core"
version = "0.1.0"
description = "Workstation runtime core package for Realized."
requires-python = ">=3.14"
dependencies = [
    "realized-core-governance==0.1.0",
    "realized-core-semantics==0.1.0",
    "realized-skill-semantics==0.1.0",
    "realized-host-interaction",
    "realized-workstation",
    "realized-workstation-contracts",
    "realized-workstation-foundation-events",
    "realized-workstation-foundation-host",
    "realized-workstation-foundation-models",
    "realized-workstation-foundation-projections",
    "realized-workstation-skills-core",
    "realized-workstation-skills-planning",
]

[tool.uv.sources]
realized-core-governance = { workspace = true }
realized-core-semantics = { workspace = true }
realized-skill-semantics = { workspace = true }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.runtime.core"]
namespaces = true
