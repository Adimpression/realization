[project]
name = "realized-workstation-skills-builtin"
version = "0.1.0"
description = "Workstation built-in skills package for Realized."
requires-python = ">=3.14"
dependencies = ["realized-workstation"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.skills.builtin"]
namespaces = true
