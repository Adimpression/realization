[project]
name = "realized-workstation-subject-core"
version = "0.1.0"
description = "Workstation subject workflow core package for Realized."
requires-python = ">=3.14"
dependencies = [
    "realized-workstation",
    "realized-workstation-contracts",
    "realized-workstation-foundation-host",
    "realized-workstation-runtime-core",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.subject.core"]
namespaces = true
