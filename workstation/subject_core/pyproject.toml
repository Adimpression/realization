[project]
name = "realized-workstation-subject-core"
version = "0.1.0"
description = "Workstation subject workflow core package for Realized."
requires-python = ">=3.14"
dependencies = [
    "coordinated-transformation==0.1.0",
    "dst==0.1.0",
    "realized-core-runtime==0.1.0",
    "realized-core-semantics==0.1.0",
    "realized-workstation",
    "realized-workstation-contracts",
]

[tool.uv.sources]
coordinated-transformation = { workspace = true }
dst = { workspace = true }
realized-core-runtime = { workspace = true }
realized-core-semantics = { workspace = true }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.subject.core"]
namespaces = true
