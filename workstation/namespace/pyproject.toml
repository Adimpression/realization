[project]
name = "realized-workstation"
version = "0.1.0"
description = "Shared namespace package for Realized workstation components."
requires-python = ">=3.14"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation"]
