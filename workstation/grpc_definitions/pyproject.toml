[project]
name = "realized-workstation-grpc-definitions"
version = "0.1.0"
description = "Workstation gRPC definitions package for Realized."
requires-python = ">=3.14"
dependencies = [
    "realized-workstation",
    "grpcio>=1.80.0",
    "protobuf>=6.33.6",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.grpc.definitions"]
namespaces = true

[tool.setuptools.package-data]
"workstation.grpc.definitions" = ["*.proto"]
