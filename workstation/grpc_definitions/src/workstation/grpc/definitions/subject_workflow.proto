  // How: Set true for preview-only interactions.
  // Example: false
  bool preview_only = 8;

  // What: Current client projection context.
  // Why: Interaction projections can still depend on markdown/assistant state.
  // How: Pass the same context used by the current snapshot.
  // Example: {"can_capture_assistant": true}
  SubjectPhaseProjectionContext projection_context = 9;
}

// What: Response returned after applying a lightweight client interaction.
// Why: The client needs the refreshed snapshot and normalized progress state.
// How: Replace the rendered snapshot and local cached progress with the
// returned values.
// Valid Example:
//   {
//     "snapshot": {"phase_view": {"phase": "review"}},
//     "progress_json": "{\"selectedSectionId\":\"section_02\"}",
//     "progress_fingerprint": "38b62d00aefe",
//     "trace_id": "subject-interaction-response_4ec1eb3a",
//     "parent_id": "subject-interaction-request_5e47cfda"
//   }
message ApplySubjectInteractionResponse {
  // What: Refreshed workflow snapshot after the interaction.
  // Why: The client should re-render from authoritative service state.
  // How: Replace local rendered state with this snapshot.
  // Example: {"phase_view":{"phase":"review"}}
  SubjectWorkflowSnapshotView snapshot = 1;

  // What: Normalized client progress JSON after the interaction.
  // Why: The service may mutate stored client progress while handling the
  // interaction.
  // How: Replace the local cached progress with it.
  // Example: "{\"selectedSectionId\":\"section_02\"}"
  string progress_json = 2;

  // What: Fingerprint of the returned progress state.
  // Why: Clients can cheaply detect stale progress caches.
  // How: Treat it as opaque version metadata.
  // Example: "38b62d00aefe"
  string progress_fingerprint = 3;

  // What: Trace id for the response.
  // Why: Interaction application is a traceable operation.
  // How: Log it when debugging.
  // Example: "subject-interaction-response_4ec1eb3a"
  string trace_id = 100;

  // What: Parent trace id linking back to the request.
  // Why: Diagnostics need causal linkage.
  // How: Treat it as opaque metadata.
  // Example: "subject-interaction-request_5e47cfda"
  string parent_id = 101;
}

// What: gRPC service exposing the subject workflow semantic surface.
// Why: All workstation UIs should consume the same authoritative workflow
// semantics through one contract.
// How: Use unary RPCs for initial reads and mutations, then watch the stream
// for later updates.
// Valid Example:
//   - `ListSubjects` -> choose `smart_city_travel`
//   - `GetSubjectWorkflowSnapshot(phase="research")`
//   - `WatchSubjectWorkflow`
//   - `ApplySubjectAction(action_key="approve_import")`
service SubjectWorkflowService {
  // What: Lists all current subjects for one workstation root.
  // Why: Clients need a subject picker before opening any workflow phase.
  // How: Call it after bootstrap and before selecting a subject.
  // Valid Example:
  //   request: {"root_path": "/srv/workstations/transit"}
  //   response: {"subjects": [{"subject_id": "smart_city_travel"}]}
  rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse);

  // What: Returns just the phase projection for one subject and phase.
  // Why: Some clients fetch the phase body independently from controls/panes.
  // How: Use it when you do not need the composite snapshot.
  // Valid Example:
  //   request: {"root_path": "/srv/workstations/transit", "subject_id": "smart_city_travel", "phase": "research"}
  //   response: {"view": {"phase": "research", "phase_title": "Gather"}}
  rpc GetSubjectPhaseView(GetSubjectPhaseViewRequest) returns (GetSubjectPhaseViewResponse);

  // What: Returns the control bundle for one subject and phase.
  // Why: Some clients fetch controls independently from the main phase body.
  // How: Use it when you need just the interactive control surface.
  // Valid Example:
  //   request: {"root_path": "/srv/workstations/transit", "subject_id": "smart_city_travel", "phase": "research"}
  //   response: {"bundle": {"phase": "research"}}
  rpc GetSubjectControlBundle(GetSubjectControlBundleRequest) returns (GetSubjectControlBundleResponse);

  // What: Returns the pane bundle for one subject and phase.
  // Why: Multi-pane clients can fetch pane projections separately when needed.
  // How: Use it when you need only pane content.
  // Valid Example:
  //   request: {"root_path": "/srv/workstations/transit", "subject_id": "smart_city_travel", "phase": "research"}
  //   response: {"bundle": {"phase": "research", "panes": []}}
  rpc GetSubjectPaneBundle(GetSubjectPaneBundleRequest) returns (GetSubjectPaneBundleResponse);

  // What: Returns the full subject workflow snapshot.
  // Why: Most clients want one authoritative initial projection before
  // opening a watch stream.
  // How: Call this first when opening a subject.
  // Valid Example:
  //   request: {"root_path": "/srv/workstations/transit", "subject_id": "smart_city_travel", "phase": "research"}
  //   response: {"snapshot": {"phase_view": {"phase": "research"}}}
  rpc GetSubjectWorkflowSnapshot(GetSubjectWorkflowSnapshotRequest) returns (GetSubjectWorkflowSnapshotResponse);

  // What: Streams full-snapshot updates for one watched subject/phase.
  // Why: Clients need event-driven synchronization as workflow state changes.
  // How: Open the stream after `GetSubjectWorkflowSnapshot` and replace local
  // state from each emitted `snapshot`.
  // Valid Example:
  //   request: {"root_path": "/srv/workstations/transit", "subject_id": "smart_city_travel", "phase": "research"}
  //   response sequence:
  //     1. {"event_kind": "initial_state", "sequence": 1, "snapshot_version": "subject-research-1"}
  //     2. {"event_kind": "subject_workflow_changed", "sequence": 2, "snapshot_version": "subject-research-2"}
  rpc WatchSubjectWorkflow(WatchSubjectWorkflowRequest) returns (stream SubjectWorkflowSnapshotUpdate);

  // What: Applies one semantic workflow action.
  // Why: Actions are the governed mutation surface for subject workflow state.
  // How: Submit the action key supplied by the current projection and then
  // re-render from the returned phase view.
  // Valid Example:
  //   request: {"root_path": "/srv/workstations/transit", "subject_id": "smart_city_travel", "phase": "research", "action_key": "approve_import"}
  //   response: {"result": {"status_text": "Import approved."}, "view": {"preferred_phase": "itemize"}}
  rpc ApplySubjectAction(ApplySubjectActionRequest) returns (ApplySubjectActionResponse);

  // What: Reads client-scoped subject progress JSON.
  // Why: The workflow isolates ephemeral view/progress state per client
  // session.
  // How: Call it when reconnecting or restoring a client session.
  // Valid Example:
  //   request: {"root_path": "/srv/workstations/transit", "subject_id": "smart_city_travel", "client_session_id": "flutter-shell-a"}
  //   response: {"progress_json": "{\"selectedImportId\":\"import_1\"}"}
  rpc GetClientSubjectProgress(GetClientSubjectProgressRequest) returns (GetClientSubjectProgressResponse);

  // What: Persists client-scoped subject progress JSON.
  // Why: Clients need to store isolated ephemeral view/progress state.
  // How: Write back the opaque JSON blob whenever client-local progress
  // changes.
  // Valid Example:
  //   request: {"root_path": "/srv/workstations/transit", "subject_id": "smart_city_travel", "client_session_id": "flutter-shell-a", "progress_json": "{\"selectedImportId\":\"import_1\"}"}
  //   response: {"progress_json": "{\"selectedImportId\":\"import_1\"}"}
  rpc PutClientSubjectProgress(PutClientSubjectProgressRequest) returns (PutClientSubjectProgressResponse);

  // What: Applies one lightweight client interaction.
  // Why: Some client-local workflow interactions are distinct from full
  // semantic subject actions.
  // How: Use it for interaction keys that mutate client progress and return a
  // refreshed snapshot.
  // Valid Example:
  //   request: {"root_path": "/srv/workstations/transit", "subject_id": "smart_city_travel", "phase": "review", "client_session_id": "flutter-shell-a", "interaction_key": "report_scope_select", "target_id": "section_02"}
  //   response: {"snapshot": {"phase_view": {"phase": "review"}}, "progress_json": "{\"selectedSectionId\":\"section_02\"}"}
  rpc ApplySubjectInteraction(ApplySubjectInteractionRequest) returns (ApplySubjectInteractionResponse);
}
