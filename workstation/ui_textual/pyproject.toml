[project]
name = "realized-workstation-ui-textual"
version = "0.1.0"
description = "Textual workstation UI package for Realized."
requires-python = ">=3.14"
dependencies = [
    "realized-workstation",
    "realized-workstation-contracts",
    "realized-workstation-foundation-projections",
    "realized-workstation-shell-core",
    "realized-workstation-subject-textual",
    "realized-workstation-ui-shared",
    "rich==14.3.3",
    "textual==8.2.3",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.ui.textual"]
namespaces = true
