[project]
name = "realized-workstation-skills-planning"
version = "0.1.0"
description = "Workstation skill planning package for Realized."
requires-python = ">=3.14"
dependencies = [
    "realized-core-runtime==0.1.0",
    "realized-core-semantics==0.1.0",
    "realized-skill-application==0.1.0",
    "realized-skill-semantics",
    "realized-workstation",
    "realized-workstation-contracts",
    "realized-workstation-foundation-host",
    "realized-workstation-foundation-models",
    "realized-workstation-skills-core",
]

[tool.uv.sources]
realized-core-runtime = { workspace = true }
realized-core-semantics = { workspace = true }
realized-skill-application = { workspace = true }
realized-skill-semantics = { workspace = true }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.skills.planning"]
namespaces = true
