[project]
name = "realized-workstation-compatibility"
version = "0.1.0"
description = "Supported historical workstation import identities for Realized."
requires-python = ">=3.14"
dependencies = [
    "realized-workstation",
    "realized-workstation-contracts",
    "realized-workstation-runtime-core",
    "realized-workstation-subject-service",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "workstation.compatibility",
    "workstation.foundation.events",
    "workstation.foundation.host",
    "workstation.shell.core",
]
namespaces = true
