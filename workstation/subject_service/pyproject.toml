[project]
name = "realized-workstation-subject-service"
version = "0.1.0"
description = "Workstation subject workflow service package for Realized."
requires-python = ">=3.14"
dependencies = [
    "realized-core-semantics==0.1.0",
    "realized-workstation",
    "realized-workstation-contracts",
    "realized-workstation-foundation-events",
    "realized-workstation-foundation-models",
    "realized-workstation-grpc-definitions",
    "realized-workstation-subject-core",
    "grpcio>=1.80.0",
    "playwright==1.58.0",
    "trafilatura==2.0.0",
]

[tool.uv.sources]
realized-core-semantics = { workspace = true }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.subject.service"]
namespaces = true
