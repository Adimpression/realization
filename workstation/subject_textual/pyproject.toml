[project]
name = "realized-workstation-subject-textual"
version = "0.1.0"
description = "Workstation textual subject workflow package for Realized."
requires-python = ">=3.14"
dependencies = [
    "realized-workstation-contracts",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["workstation.subject.textual"]
namespaces = true
