[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dst"
version = "0.1.0"
description = "Decision Support Tool layer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "coordinated-transformation==0.1.0",
    "realized-core-semantics==0.1.0",
]

[tool.uv.sources]
coordinated-transformation = { workspace = true }
realized-core-semantics = { workspace = true }

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dst"]

[tool.setuptools.package-data]
dst = [
    "*.md",
    "tests/fixtures/dst/*.json",
    "tests/fixtures/dst/discovery/*.json",
    "tests/fixtures/dst/normalized/*.json",
]
