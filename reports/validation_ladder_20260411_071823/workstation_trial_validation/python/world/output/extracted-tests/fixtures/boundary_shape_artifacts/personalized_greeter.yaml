Personalized Greeter:
  Description:
    - Input-value greeting function.
  In:
    - name: recipient name
  Out:
    - greeting: personalized greeting
  Metadata:
    artifact_type: ability
    representation: python_script
    function_bit: 1
    boundary_shape:
      - a*
      - d*
    scope: reuse when a greeting must be produced from a supplied name
    reusability: broad_reuse
    admissibility: admitted
    learning_relation: extends_parameters
    justification: A bounded greeting artifact parameterized by a name value.
    question: Say hi to a named person.
    input_contract:
      name: recipient name
    output_contract:
      greeting: personalized greeting
    python_script: |
      # /// script
      # requires-python = ">=3.11"
      # dependencies = ["msgspec", "orjson"]
      # ///
      from __future__ import annotations

      import argparse
      import sys

      import msgspec
      import orjson


      class InputPayload(msgspec.Struct, kw_only=True):
          name: str


      class OutputPayload(msgspec.Struct, kw_only=True):
          status: str
          answer: str
          result: dict[str, str]
          notes: list[str] = []


      def run(payload: InputPayload) -> OutputPayload:
          greeting = f"hi, {payload.name}"
          return OutputPayload(
              status="ok",
              answer=greeting,
              result={"greeting": greeting},
              notes=["input-value greeting"],
          )


      def main() -> None:
          parser = argparse.ArgumentParser(description="personalized greeter")
          parser.add_argument("--input-json", help="optional JSON payload")
          args = parser.parse_args()
          raw = args.input_json.encode("utf-8") if args.input_json else sys.stdin.buffer.read()
          payload = orjson.loads(raw) if raw else {}
          typed = msgspec.convert(payload, type=InputPayload)
          sys.stdout.buffer.write(orjson.dumps(msgspec.to_builtins(run(typed))))
          sys.stdout.buffer.write(b"\n")


      if __name__ == "__main__":
          main()
