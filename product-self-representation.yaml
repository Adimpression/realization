  dutyId: duty.curate-decision-analysis
  title: Curate and run decision analysis
  description: Draft constructs and included items are turned into a decision frame, missing relations are completed, and decision analysis is run or blocked with explicit recovery guidance.
  purpose: Ensure Review and Publication only proceed from a current and trustworthy decision-analysis state.
  trigger: The operator chooses Start Decision Analysis, Refresh DST Analysis, or Run Decision Analysis.
  preconditions:
  - A current review composition exists.
  - The active subject or report question is ready for decision analysis.
  primaryFlow:
  - Accept or edit transformation constructs and included items.
  - Complete any missing structural relations required by the frame.
  - Create or refresh the decision frame.
  - Run analysis or surface a blocked recovery path.
  completionCriteria:
  - A current or explicitly blocked decision frame exists.
  - Review and Publication gates reflect whether the current analysis is recommendable, stale, or blocked.
  variants:
  - Weak-prose v10 subjects start analysis directly from DST discovery.
  - Same-subject v2 to v10 progression refreshes rather than creating the frame from scratch.
  failureBoundaries:
  - If the frame is blocked, Review and Publication must route back to recovery rather than acting as approved.
  - Open Model may remain available but must not hide blocked analysis state.
  nonGoals:
  - This journey does not itself approve the report plan.
  - This journey does not allow Publication build while the frame is stale or blocked.
