  networkBoundaries:
  - boundaryId: boundary.authoritative-projection-api
    name: Authoritative Projection API
    description: The gRPC and watch-stream boundary that projects subject and shell workflow state to Flutter, Textual, and other clients from one authoritative server computation.
    interactionId: interaction.project-authoritative-workflow-state
    realWorldProcess: A user clicks or types and expects the same updated workflow meaning across all projections almost immediately.
    realWorldLatencyClass: under-1s
    separationAllowed: true
    consistencyExpectation: read-your-writes
    causalityJustification: Projection is split from the UI process for multi-client parity, but the semantic causality is still tight and must preserve immediate read-your-writes behavior.
    userVisibleImpact: If the projection boundary lags or diverges, tabs, actions, and pane meaning can disagree across shells.
    failureMode: A stale or broken stream can show old actions or pane data even though the semantic state has already changed.
    exceptionApproval:
      approvalStatus: approved
      approvedBy: repo-architecture
      approvedAt: '2026-05-16T00:00:00Z'
      reason: The product explicitly supports multiple projections over one authoritative workflow computation, so a fast boundary is intentional and treated as a justified exception.
  - boundaryId: boundary.hosted-llm-supplement
    name: Hosted LLM Supplement
    description: The optional remote model boundary used when governed reduction or assistive discovery requires external LLM support rather than local deterministic logic alone.
    interactionId: interaction.run-governed-reduction
    realWorldProcess: Supplemental model reasoning is useful when classification, drafting, or discovery would otherwise stall, and users already expect that work to take noticeable time.
    realWorldLatencyClass: over-or-equal-1s
    separationAllowed: true
    consistencyExpectation: best-effort
    causalityJustification: LLM supplementation is causally slower than direct UI actions and is explicitly recorded so the product can separate governed work from deterministic replay claims.
    userVisibleImpact: Users see the controller remain busy or gated until supplemental reasoning finishes or is replayed from a recorded transcript.
    failureMode: Remote model latency or unavailability can delay completion, but the session should still preserve explicit receipts and failure surfaces.
  - boundaryId: boundary.publication-renderer
    name: Publication Renderer
    description: The rendering boundary that turns a locked publication composition into built artifacts using a renderer and validation pipeline.
    interactionId: interaction.build-publication
    realWorldProcess: Building report artifacts is a meaningful rendering task rather than a single in-memory state mutation.
    realWorldLatencyClass: over-or-equal-1s
    separationAllowed: true
    consistencyExpectation: read-your-writes
    causalityJustification: The product may separate rendering into its own worker or process because the real-world process is an actual build step with visible completion semantics.
    userVisibleImpact: A user sees a build state, then either finished artifacts or an explicit failure report.
    failureMode: A renderer failure must leave the approved inputs intact and expose the failed build rather than silently dropping the artifact.
  - boundaryId: boundary.remote-http-capability
    name: Remote HTTP Capability
    description: The capability-mediated network boundary used when workstation work must call a remote HTTP endpoint.
    interactionId: interaction.perform-network-request
    realWorldProcess: Remote systems, internet latency, and remote service behavior are inherently outside the local workstation causality envelope.
    realWorldLatencyClass: over-or-equal-1s
    separationAllowed: true
    consistencyExpectation: not-applicable
    causalityJustification: Network requests are allowed to be separate because the corresponding real-world process is communication with another system, not a local semantic transition.
    userVisibleImpact: Users may see longer waits, retries, or failures that are attributable to the remote system rather than the local UI projection.
    failureMode: If the remote system fails, the product should emit attributable failure receipts rather than faking success.
  - boundaryId: boundary.artifact-preview-surface
    name: Artifact Preview Surface
    description: The browser or artifact-serving boundary that opens supported build outputs such as report.pdf or report.md for inspection.
    interactionId: interaction.preview-publication-artifact
    realWorldProcess: Preview dispatch is usually immediate, but the actual browser viewer or artifact host can resolve on its own timing.
    realWorldLatencyClass: mixed
    separationAllowed: true
    consistencyExpectation: read-your-writes
    causalityJustification: Preview uses a separate surface because artifact viewing is not the same semantic operation as editing the workflow, yet users still expect the latest built artifact to be opened.
    userVisibleImpact: If preview routing is broken, the build may succeed but the user cannot inspect the artifact from the workstation.
    failureMode: A preview host issue can leave the artifact available but not openable from the projection surface.
objectives:
- objectiveId: objective.governed-realization
  title: Govern realized work through explicit semantic reduction
  description: The product should reduce work through explicit governed decomposition rather than opaque one-shot answers or hidden side effects.
  successMeaning: Success means every important action can be explained as explicit governed work with visible next steps, receipts, or blocks.
- objectiveId: objective.subject-corpus-and-publication
  title: Maintain canonical subject truth and deterministic publication outputs
  description: The product should let users ingest subject material, turn it into canonical truth, and build report artifacts from approved and locked projections over that truth.
  successMeaning: Success means another implementation could rebuild the same subject and publication behavior from the spec alone.
- objectiveId: objective.safe-extensible-workstation
  title: Provide a host-owned workstation with explicit capabilities
  description: The product should let chat, skills, workflows, and subject work operate from one session without ambient host authority.
  successMeaning: Success means operators can extend the system without losing explicit capability mediation or attribution.
- objectiveId: objective.replayable-evidence
  title: Preserve attributable evidence and replayable bundles
  description: The product should export enough evidence about governed work that later replay and diagnosis remain possible even after the original code changes.
  successMeaning: Success means runs, builds, permissions, and activity can be reconstructed and compared from durable evidence.
- objectiveId: objective.multi-projection-consistency
  title: Keep multiple projections semantically consistent
  description: The product should support Textual, Flutter, and other projections over one authoritative workflow state instead of allowing each client to invent semantic meaning.
  successMeaning: Success means selection, gating, panes, and next-step guidance remain consistent across projections.
- objectiveId: objective.reusable-governed-composition
  title: Make skills and workflows reusable governed building blocks
  description: The product should expose governed skills and Blend workflows as reusable composition units with explicit permissions and attributable execution.
  successMeaning: Success means reusable operators can be cataloged, invoked, composed, and replay-inspected without leaving the governance envelope.
