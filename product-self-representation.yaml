  - A workflow cannot start with missing required operators or inputs.
  relatedObjectIds:
  - object.blend-workflow-plan
  - object.governed-skill
  relatedInteractionIds:
  - interaction.compose-and-run-blend-workflow
  relatedInvariantIds:
  - invariant.no-ambient-authority
  expectedUserVisibleOutcome: The user sees whether the workflow plan is fully bound and ready.
  status: active
  stateTransitions:
  - objectId: object.blend-workflow-plan
    toState: bound
    fromState: draft
- stepId: step.workflows-run-and-emit-graph
  journeyId: journey.workflows-compose-and-run-plan
  sequence: 3
  title: Run and emit graph
  given: Given a bound workflow plan, the runtime can execute the workflow and emit graph, outputs, and step receipts.
  when: When workflow execution runs,
  then: Then a workflow run exists with emitted graph and attributable execution events.
  thenAssertions:
  - A workflow run is created from the bound plan.
  - The execution graph reflects the bound operators and actual run results.
  relatedObjectIds:
  - object.blend-workflow-plan
  - object.blend-workflow-run
  - object.activity-event-log
  relatedInteractionIds:
  - interaction.compose-and-run-blend-workflow
  relatedInvariantIds:
  - invariant.every-material-action-is-attributable
  expectedUserVisibleOutcome: The user sees workflow progress, halts, or completion in the activity and workflow surfaces.
  status: active
  stateTransitions:
  - objectId: object.blend-workflow-run
    toState: completed
    fromState: started
- stepId: step.workflows-rerun-or-inspect-output
  journeyId: journey.workflows-compose-and-run-plan
  sequence: 4
  title: Rerun or inspect output
  given: Given a workflow run, the operator can inspect the outputs or rerun the plan under governance.
  when: When the inspection or rerun action is applied,
  then: Then outputs remain tied to the original run and any new rerun becomes a new attributable run rather than mutating history.
  thenAssertions:
  - Outputs remain attributable to one workflow run.
  - A rerun creates a distinct new run identity.
  relatedObjectIds:
  - object.blend-workflow-run
  - object.activity-event-log
  relatedInteractionIds:
  - interaction.compose-and-run-blend-workflow
  - interaction.inspect-activity-and-history
  relatedInvariantIds:
  - invariant.every-material-action-is-attributable
  expectedUserVisibleOutcome: The user sees the workflow outputs or a new rerun state without losing prior history.
  status: active
  stateTransitions:
  - objectId: object.blend-workflow-run
    toState: completed
    fromState: completed
- stepId: step.activity-subscribe-or-load-feed
  journeyId: journey.activity-inspect-history-and-diagnose
  sequence: 1
  title: Subscribe or load feed
  given: Given existing governed activity, the Activity surface can load or subscribe to the event feed for the session or subject.
  when: When the activity feed is opened,
  then: Then current and prior activity events become visible to the operator.
  thenAssertions:
  - The activity feed contains attributable events rather than only ephemeral UI state.
  - The feed may be loaded incrementally without changing event meaning.
  relatedObjectIds:
  - object.activity-event-log
  relatedInteractionIds:
  - interaction.inspect-activity-and-history
  relatedInvariantIds:
  - invariant.every-material-action-is-attributable
  expectedUserVisibleOutcome: The user sees the activity feed and can browse recent governed events.
  status: active
  stateTransitions:
  - objectId: object.activity-event-log
    toState: streaming
    fromState: materialized
- stepId: step.activity-render-attributed-events
  journeyId: journey.activity-inspect-history-and-diagnose
  sequence: 2
  title: Render attributed events
  given: Given loaded activity events, the product can render event entries with enough semantics to distinguish builds, approvals, imports, permissions, and runs.
  when: When the feed entries are rendered,
  then: Then the operator can tell what happened, to which object, and under which authority.
  thenAssertions:
  - Each material event is attributable to a governed action.
  - Entries expose enough context to choose one for deeper inspection.
  relatedObjectIds:
  - object.activity-event-log
  - object.workflow-snapshot
  relatedInteractionIds:
  - interaction.inspect-activity-and-history
  relatedInvariantIds:
  - invariant.every-material-action-is-attributable
  expectedUserVisibleOutcome: The user sees labeled activity entries that can be selected for deeper inspection.
  status: active
  stateTransitions:
  - objectId: object.workflow-snapshot
    toState: current
    fromState: current
- stepId: step.activity-inspect-related-receipts
  journeyId: journey.activity-inspect-history-and-diagnose
  sequence: 3
  title: Inspect related receipts
  given: Given a chosen activity event, the product can open related build receipts, run bundles, or workflow outcomes for deeper inspection.
  when: When the operator opens a related receipt or build,
  then: Then the product reveals the durable evidence tied to that event rather than a transient UI reconstruction.
  thenAssertions:
  - Related receipts are reachable from the originating activity event.
  - The opened receipt or build is stable enough for inspection and diagnosis.
  relatedObjectIds:
  - object.activity-event-log
  - object.publication-build
  - object.run-bundle
  - object.subject-reasoning-scope
  relatedInteractionIds:
  - interaction.inspect-activity-and-history
  relatedInvariantIds:
  - invariant.replay-verification-compares-effects-and-decision-path
  expectedUserVisibleOutcome: The user sees durable evidence connected to the chosen activity entry.
  status: active
  stateTransitions:
  - objectId: object.publication-build
    toState: ok
    fromState: ok
- stepId: step.activity-use-history-to-diagnose-or-confirm
  journeyId: journey.activity-inspect-history-and-diagnose
  sequence: 4
  title: Use history to diagnose or confirm
  given: Given activity events and related receipts, the operator can confirm a successful path or diagnose a failure, drift, or missing approval.
  when: When the operator finishes inspection,
  then: Then they can name what happened, why it happened, and which governed object or receipt proves it.
  thenAssertions:
  - History supports confirmation or diagnosis instead of guesswork.
  - The surface preserves the link from symptom back to attributable cause.
  relatedObjectIds:
  - object.activity-event-log
  - object.controller-run
  - object.run-bundle
  relatedInteractionIds:
  - interaction.inspect-activity-and-history
  - interaction.export-and-replay-run-bundle
  relatedInvariantIds:
  - invariant.every-material-action-is-attributable
  - invariant.replay-verification-compares-effects-and-decision-path
  expectedUserVisibleOutcome: The user leaves Activity with an explainable account of the original governed work.
  status: active
  stateTransitions:
  - objectId: object.run-bundle
    toState: verified
    fromState: exported
experience:
  slis:
  - sliId: sli.chat-first-meaningful-feedback
    name: Chat first meaningful feedback latency
    description: Measures how quickly Chat produces a meaningful routed or executed outcome for an interactive request.
    measurementType: latency
    unit: milliseconds
    eventSource: workstation shell routed-response receipts
    appliesToDutyIds:
    - duty.route-chat-work
    appliesToJourneyIds:
    - journey.chat-route-governed-work
    status: active
  - sliId: sli.replay-verification-correctness
    name: Replay verification correctness
    description: Measures whether replay verification correctly classifies matching and diverging runs using bundled evidence.
    measurementType: correctness
    unit: percent
    eventSource: replay verifier classification records
    appliesToDutyIds:
    - duty.replay-governed-runs
    appliesToJourneyIds:
    - journey.replay-export-and-verify-governed-run
    status: active
  - sliId: sli.gather-admission-success
    name: Gather admission success rate
    description: Measures whether source staging, maintained-file comparison, and subject activation lead to a current subject context without silent drift.
    measurementType: success-rate
