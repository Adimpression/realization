- journeyId: journey.permissions-grant-and-retry-blocked-work
  dutyId: duty.govern-session-capabilities
  title: Grant or revoke session capabilities
  description: The permissions surface lists current authorities, applies explicit grants or revocations, and lets blocked governed work resume under the new session policy.
  purpose: Keep host authority explicit and retryable instead of ambient or hidden inside implementation details.
  trigger: A user opens Permissions or a blocked action requires granting or revoking a capability.
  preconditions:
  - A workstation session exists.
  - At least one capability entry or blocked action is relevant to the session.
  primaryFlow:
  - List the current capability state.
  - Grant or revoke a capability entry explicitly.
  - Persist the session change.
  - Retry or resume the formerly blocked governed action.
  completionCriteria:
  - The session capability state is explicit and current.
  - Blocked work can be retried under the updated permission model.
  variants:
  - The operator revokes authority proactively rather than in response to a block.
  - The permissions flow is entered from a blocked action rather than from the tab directly.
  failureBoundaries:
  - A capability may not become ambient simply because a similar action succeeded earlier.
  - Retry must explain why the work remains blocked if the new authority is still insufficient.
  nonGoals:
  - This journey does not execute unrelated work while changing permissions.
  - This journey does not hide capability provenance from activity history.
  inputObjectIds:
  - object.workstation-session
  - object.capability-grant
  outputObjectIds:
  - object.capability-grant
  - object.activity-event-log
  - object.workflow-snapshot
