      edgeType: primary
    - fromStepId: step.skills-inspect-requested-permissions
      toStepId: step.skills-invoke-with-explicit-inputs
      edgeType: primary
    notes: The canonical path is linear even when the journey exposes variants or failure boundaries.
- journeyId: journey.workflows-compose-and-run-plan
  dutyId: duty.manage-skills-and-workflows
  title: Compose bind and run a Blend workflow
  description: A workflow plan is selected or composed, its operators and inputs are bound, and the resulting run emits graph, outputs, and attributed receipts.
  purpose: Expose reusable workflow composition and execution as a first-class governed surface built on skills and explicit world bindings.
  trigger: The operator opens the workflow surface or a routed request requires workflow execution.
  preconditions:
  - A workflow plan or composition intent exists.
  - Required operators and world mounts are available.
  primaryFlow:
  - Select or compose the workflow plan.
  - Bind operators and explicit inputs.
  - Execute the workflow run and emit execution graph.
  - Inspect outputs or rerun from the governed result.
  completionCriteria:
  - A workflow run exists with attributed execution events.
  - The graph and outputs correspond to the bound plan rather than hidden runtime state.
  variants:
  - The plan is pre-existing rather than composed in the session.
  - The run halts and is inspected instead of completing cleanly.
  failureBoundaries:
  - If an operator is unbound, the workflow must halt explicitly.
  - A failed step must surface its halt or failure instead of fabricating a completed graph.
  nonGoals:
  - This journey does not redefine individual skill semantics.
  - This journey does not bypass operator permission requirements.
  inputObjectIds:
  - object.blend-workflow-plan
  - object.governed-skill
  - object.workstation-session
  outputObjectIds:
  - object.blend-workflow-run
  - object.activity-event-log
  invariantIds:
  - invariant.no-ambient-authority
  - invariant.every-material-action-is-attributable
  stepIds:
  - step.workflows-select-or-compose-plan
  - step.workflows-bind-operators-and-inputs
  - step.workflows-run-and-emit-graph
  - step.workflows-rerun-or-inspect-output
  sliIds:
  - sli.workflow-run-success
  sloIds:
  - slo.workflow-run-success-at-99-percent
  goldenTraceIds:
  - trace.workflow-compose-bind-run-and-inspect
  antiGoldenTraceIds:
  - antitrace.workflow-runs-with-unbound-operator
  timing:
    realWorldLatencyClass: mixed
    syncExpectation: mixed
    causalJustification: Plan composition is interactive, but running a workflow across several operators is intentionally separable and may take longer than one second.
  networkBoundaryIds:
  - boundary.authoritative-projection-api
  - boundary.remote-http-capability
  status: active
  version: 1.0.0
  flow:
    entryStepId: step.workflows-select-or-compose-plan
