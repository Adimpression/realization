- journeyId: journey.skills-import-export-and-invoke-governed-skill
  dutyId: duty.manage-skills-and-workflows
  title: Catalog import export and invoke a governed skill
  description: The Skills surface lets the operator inspect catalog metadata, import or export skill bundles, review permissions, and invoke a governed skill with explicit inputs.
  purpose: Expose the governed skill system as an explicit reusable capability surface rather than hidden implementation detail.
  trigger: The operator opens Skills or a routed request requires skill import, export, or invocation.
  preconditions:
  - The session can read the skill catalog.
  - A skill descriptor or invocation request is available.
  primaryFlow:
  - Inspect the skill catalog and descriptors.
  - Import or export a skill bundle if needed.
  - Inspect requested permissions before invocation.
  - Invoke the skill with explicit inputs and record its output.
  completionCriteria:
  - The relevant skill artifact is visible, imported or exported if needed, and invokable with explicit authority.
  - Invocation output and capability use are attributable.
  variants:
  - The operator exports an existing skill instead of importing a new one.
  - The skill is invoked indirectly from Chat or a workflow instead of directly from Skills.
  failureBoundaries:
  - If a skill requests disallowed permissions, invocation must block explicitly.
  - If import fails, the catalog must not pretend the new skill is active.
  nonGoals:
  - This journey does not compose multi-step workflow graphs; that belongs to Blend workflow execution.
  - This journey does not grant permissions silently during skill invocation.
  inputObjectIds:
  - object.governed-skill
  - object.workstation-session
  outputObjectIds:
  - object.governed-skill
  - object.activity-event-log
  - object.capability-grant
  invariantIds:
  - invariant.no-ambient-authority
  - invariant.every-material-action-is-attributable
  stepIds:
  - step.skills-search-or-inspect-catalog
  - step.skills-import-or-export-bundle
  - step.skills-inspect-requested-permissions
  - step.skills-invoke-with-explicit-inputs
  sliIds:
  - sli.skill-invocation-success
  sloIds:
  - slo.skill-invocation-success-at-99-percent
  goldenTraceIds:
  - trace.skills-import-inspect-and-invoke
  antiGoldenTraceIds:
  - antitrace.skill-invokes-with-hidden-authority
  timing:
    realWorldLatencyClass: mixed
    syncExpectation: mixed
    causalJustification: Catalog inspection is quick, while skill import or invocation may run packaging or process work and therefore may take longer than one second.
  networkBoundaryIds:
  - boundary.authoritative-projection-api
  - boundary.remote-http-capability
  status: active
  version: 1.0.0
  flow:
    entryStepId: step.skills-search-or-inspect-catalog
    exitStepIds:
    - step.skills-invoke-with-explicit-inputs
    edges:
