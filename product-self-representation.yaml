      elapsedTimeMs: 220
      relatedStepIds:
      - step.workflows-bind-operators-and-inputs
    - sequence: 2
      title: Run still starts
      event: Execution begins anyway.
      observedOutcome: The graph no longer reflects a properly bound plan.
      elapsedTimeMs: 370
      relatedStepIds:
      - step.workflows-run-and-emit-graph
    finalState: A workflow run exists even though the required binding contract was not satisfied.
    classificationReason: This is anti-golden because workflow runs must only execute from explicitly bound plans.
    status: active
    violatesStepIds:
    - step.workflows-bind-operators-and-inputs
    - step.workflows-run-and-emit-graph
    violatesInvariantIds:
    - invariant.no-ambient-authority
    violatesSloIds:
    - slo.workflow-run-success-at-99-percent
  - traceId: antitrace.activity-omits-material-build-event
    traceType: anti-golden
    title: Activity omits material build event
    description: A publication build or other material action occurs but no attributable activity event or related receipt is available for later inspection.
    dutyId: duty.inspect-activity-history
    journeyId: journey.activity-inspect-history-and-diagnose
    scenario: Build succeeds but history omits it
    trigger: A material publication build completed.
    events:
    - sequence: 1
      title: Feed loaded
      event: The activity feed is opened after the build.
      observedOutcome: The operator expects the build event to be visible.
      elapsedTimeMs: 110
      relatedStepIds:
      - step.activity-subscribe-or-load-feed
    - sequence: 2
      title: Event missing
      event: The material build event is absent or has no resolvable receipt.
      observedOutcome: The operator cannot confirm what happened.
      elapsedTimeMs: 240
      relatedStepIds:
      - step.activity-inspect-related-receipts
    finalState: A material action happened but history cannot explain or prove it.
    classificationReason: This is anti-golden because activity and receipts are required to keep governed work attributable and diagnosable.
    status: active
    violatesStepIds:
    - step.activity-render-attributed-events
    - step.activity-inspect-related-receipts
    violatesInvariantIds:
    - invariant.every-material-action-is-attributable
    violatesSloIds:
    - slo.activity-feed-freshness-under-1-second
