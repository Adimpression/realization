journeys:
- journeyId: journey.chat-route-governed-work
  dutyId: duty.route-chat-work
  title: Route chat request into governed work
  description: A user enters a prompt or follows a routed CTA and the workstation must resolve it into the right governed surface, skill, workflow, or controller action.
  purpose: Keep Chat as the universal ingress while still forcing every request through explicit governance and attributable execution.
  trigger: A chat prompt or routed call-to-action is submitted.
  preconditions:
  - A workstation session exists and has loaded its capability and projection context.
  - The request text or routed intent is available to the controller.
  primaryFlow:
  - Capture the request in the active workstation session.
  - Resolve the governed route and required authorities.
