  slos:
  - sloId: slo.chat-first-meaningful-feedback-under-1000ms
    sliId: sli.chat-first-meaningful-feedback
    name: Chat first meaningful feedback under 1000 ms
    targetOperator: <=
    targetValue: 1000
    measurementWindow: rolling 15 minutes
    consequenceOfViolation: If violated, users lose trust that Chat is the universal ingress and may repeat requests or bypass governance.
    severity: high
    status: active
  - sloId: slo.replay-verification-correctness-at-100-percent
    sliId: sli.replay-verification-correctness
    name: Replay verification correctness at 100 percent
    targetOperator: '>='
    targetValue: 100
    measurementWindow: per replayed bundle
    consequenceOfViolation: If violated, the product can no longer be trusted to preserve a reimplementation-grade account of governed work.
    severity: critical
    status: active
  - sloId: slo.gather-admission-success-at-99-percent
    sliId: sli.gather-admission-success
    name: Gather admission success at 99 percent
    targetOperator: '>='
    targetValue: 99
    measurementWindow: rolling 24 hours
    consequenceOfViolation: If violated, users cannot trust that admitted subject truth is current before itemization and publication.
    severity: critical
    status: active
  - sloId: slo.itemization-generation-success-at-99-percent
    sliId: sli.itemization-generation-success
    name: Itemization generation success at 99 percent
    targetOperator: '>='
    targetValue: 99
    measurementWindow: rolling 24 hours
    consequenceOfViolation: If violated, Draft and downstream phases cannot rely on a stable candidate inventory.
    severity: high
    status: active
  - sloId: slo.draft-composition-freshness-under-1-second
    sliId: sli.draft-composition-freshness
    name: Draft composition freshness under one second
    targetOperator: <=
    targetValue: 1
    measurementWindow: continuous while Draft is active
    consequenceOfViolation: If violated, users edit stale draft structure and lose trust in selection, inclusion, and model actions.
    severity: critical
    status: active
  - sloId: slo.decision-analysis-recoverability-at-95-percent
    sliId: sli.decision-analysis-recoverability
    name: Decision analysis recoverability at 95 percent
    targetOperator: '>='
    targetValue: 95
    measurementWindow: rolling 24 hours
    consequenceOfViolation: If violated, users can reach Review or Publication without a usable recovery path when decision analysis is stale or blocked.
    severity: critical
    status: active
  - sloId: slo.review-approval-correctness-at-100-percent
    sliId: sli.review-approval-correctness
    name: Review approval correctness at 100 percent
    targetOperator: '>='
    targetValue: 100
    measurementWindow: per approval action
    consequenceOfViolation: If violated, Publication may build from an unapproved or stale plan and the product loses semantic trustworthiness.
    severity: critical
    status: active
  - sloId: slo.publication-build-success-at-99-percent
    sliId: sli.publication-build-success
    name: Publication build success at 99 percent
    targetOperator: '>='
    targetValue: 99
    measurementWindow: rolling 24 hours
    consequenceOfViolation: If violated, the product cannot reliably turn approved plans into inspectable release artifacts.
    severity: critical
    status: active
  - sloId: slo.permission-change-latency-under-1000ms
    sliId: sli.permission-change-latency
    name: Permission change latency under 1000 ms
    targetOperator: <=
    targetValue: 1000
    measurementWindow: rolling 15 minutes
    consequenceOfViolation: If violated, blocked work feels detached from the permission change that should have resolved it.
    severity: high
    status: active
  - sloId: slo.skill-invocation-success-at-99-percent
    sliId: sli.skill-invocation-success
    name: Governed skill invocation success at 99 percent
    targetOperator: '>='
    targetValue: 99
    measurementWindow: rolling 24 hours
    consequenceOfViolation: If violated, the governed skill surface ceases to be a reliable reusable extension point.
    severity: high
    status: active
  - sloId: slo.workflow-run-success-at-99-percent
    sliId: sli.workflow-run-success
    name: Blend workflow run success at 99 percent
    targetOperator: '>='
    targetValue: 99
    measurementWindow: rolling 24 hours
    consequenceOfViolation: If violated, workflow composition stops being a dependable reusable orchestration surface.
    severity: high
    status: active
  - sloId: slo.activity-feed-freshness-under-1-second
    sliId: sli.activity-feed-freshness
    name: Activity feed freshness under one second
    targetOperator: <=
    targetValue: 1
    measurementWindow: continuous while feed subscription is active
    consequenceOfViolation: If violated, operators cannot trust activity history as a timely diagnosis surface.
    severity: high
    status: active
traces:
  golden:
  - traceId: trace.chat-route-request-to-governed-outcome
    traceType: golden
    title: Chat routes request to governed outcome
    description: A request enters Chat, is classified into the correct governed route, executes, and returns a visible outcome with receipts.
    dutyId: duty.route-chat-work
    journeyId: journey.chat-route-governed-work
    scenario: User asks the workstation to refresh a blocked subject flow
    trigger: The user submits a prompt from Chat.
    events:
    - sequence: 1
      title: Request captured
      event: Chat accepts the prompt and binds it to the active session.
      observedOutcome: A semantic request exists and is attributable.
      stateAfter: semantic request received
      elapsedTimeMs: 60
      relatedStepIds:
      - step.chat-capture-request
    - sequence: 2
      title: Route resolved
      event: The route resolver classifies the prompt as subject workflow work.
      observedOutcome: The workflow surface is chosen without ambiguity.
      elapsedTimeMs: 120
      relatedStepIds:
      - step.chat-resolve-route
    - sequence: 3
      title: Governed action executes
      event: The shell applies the routed workflow action.
      observedOutcome: Receipts and workflow updates are emitted.
      elapsedTimeMs: 420
      relatedStepIds:
      - step.chat-execute-governed-action
    - sequence: 4
      title: Visible outcome returned
      event: The updated workflow snapshot is rendered.
      observedOutcome: The user sees the new governed state and next step.
      elapsedTimeMs: 620
      relatedStepIds:
      - step.chat-return-visible-outcome
    finalState: A new authoritative workflow snapshot and activity receipts exist for the routed request.
    classificationReason: This is golden because the request, route, execution, and visible outcome all remain attributable and authoritative.
    status: active
    validatesStepIds:
    - step.chat-capture-request
    - step.chat-resolve-route
    - step.chat-execute-governed-action
    - step.chat-return-visible-outcome
  - traceId: trace.replay-export-and-verify-match
    traceType: golden
    title: Replay export and verification match
    description: A completed run is exported, replayed, and verified as constitutionally aligned with the original.
    dutyId: duty.replay-governed-runs
    journeyId: journey.replay-export-and-verify-governed-run
    scenario: Operator verifies a known-good run bundle
    trigger: The operator exports a completed governed run.
    events:
    - sequence: 1
      title: Run selected
      event: The replay surface binds to a completed run.
      observedOutcome: The original run is ready for bundle export.
      elapsedTimeMs: 80
      relatedStepIds:
      - step.replay-select-run
    - sequence: 2
      title: Bundle exported
      event: The run bundle is created with skills, traces, and artifacts.
      observedOutcome: A portable bundle now exists.
      elapsedTimeMs: 600
      relatedStepIds:
      - step.replay-export-bundle
    - sequence: 3
      title: Replay executed
      event: The bundle is replayed under the chosen determinism policy.
      observedOutcome: A replayed run with comparable receipts exists.
      elapsedTimeMs: 1100
      relatedStepIds:
      - step.replay-reconstruct-run
    - sequence: 4
      title: Replay matched
      event: The verifier compares decision flow and effects.
      observedOutcome: The replay is classified as a match.
      elapsedTimeMs: 1350
      relatedStepIds:
      - step.replay-classify-match-or-mismatch
    finalState: A verified run bundle and replay classification exist and agree with the original governed path.
    classificationReason: This is golden because replay comparison preserves both effects and decision path rather than only the final answer.
    status: active
    validatesStepIds:
    - step.replay-select-run
    - step.replay-export-bundle
    - step.replay-reconstruct-run
    - step.replay-classify-match-or-mismatch
