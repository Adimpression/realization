      edgeType: primary
    notes: The canonical path is linear even when the journey exposes variants or failure boundaries.
- journeyId: journey.activity-inspect-history-and-diagnose
  dutyId: duty.inspect-activity-history
  title: Inspect activity history and diagnose prior work
  description: The Activity surface and related history affordances let the operator inspect attributed events, receipts, builds, and replay evidence to confirm or diagnose earlier work.
  purpose: Make governed work inspectable after the fact rather than only visible at the moment of execution.
  trigger: The operator opens Activity or follows a history/receipt link from another surface.
  preconditions:
  - At least one governed action has emitted activity or build receipts.
  - The current session can subscribe to or load the event stream.
  primaryFlow:
  - Subscribe to or load the feed.
  - Render attributed events with enough semantic context.
  - Inspect related receipts, builds, or runs.
  - Use that history to confirm success or diagnose drift and failure.
  completionCriteria:
  - The operator can see relevant events and open their related receipts or artifacts.
  - History is sufficient to confirm what happened and why.
  variants:
  - The operator opens a publication build receipt rather than a generic event.
  - The operator uses history to compare an original run against a replay result.
  failureBoundaries:
  - If a material action has no activity entry, the history surface is incomplete by definition.
  - If related receipts cannot be resolved, the product must say so explicitly rather than implying full traceability.
  nonGoals:
  - This journey does not rerun or mutate the original work by default.
  - This journey does not replace the dedicated replay-verification journey.
  inputObjectIds:
  - object.activity-event-log
  - object.controller-run
  - object.publication-build
  outputObjectIds:
  - object.workflow-snapshot
  - object.activity-event-log
  - object.run-bundle
  - object.subject-reasoning-scope
  invariantIds:
  - invariant.every-material-action-is-attributable
  - invariant.replay-verification-compares-effects-and-decision-path
  stepIds:
  - step.activity-subscribe-or-load-feed
  - step.activity-render-attributed-events
  - step.activity-inspect-related-receipts
  - step.activity-use-history-to-diagnose-or-confirm
  sliIds:
  - sli.activity-feed-freshness
  sloIds:
  - slo.activity-feed-freshness-under-1-second
  goldenTraceIds:
  - trace.activity-inspect-publication-build-history
  antiGoldenTraceIds:
  - antitrace.activity-omits-material-build-event
  timing:
    realWorldLatencyClass: under-1s
    syncExpectation: synchronous
    causalJustification: History inspection is a read-mostly local projection over durable events and should therefore feel immediate once the records exist.
  networkBoundaryIds:
  - boundary.authoritative-projection-api
  status: active
  version: 1.0.0
  flow:
    entryStepId: step.activity-subscribe-or-load-feed
    exitStepIds:
    - step.activity-use-history-to-diagnose-or-confirm
    edges:
    - fromStepId: step.activity-subscribe-or-load-feed
      toStepId: step.activity-render-attributed-events
      edgeType: primary
    - fromStepId: step.activity-render-attributed-events
      toStepId: step.activity-inspect-related-receipts
      edgeType: primary
    - fromStepId: step.activity-inspect-related-receipts
      toStepId: step.activity-use-history-to-diagnose-or-confirm
      edgeType: primary
    notes: The canonical path is linear even when the journey exposes variants or failure boundaries.
steps:
- stepId: step.chat-capture-request
  journeyId: journey.chat-route-governed-work
  sequence: 1
  title: Capture request
  given: Given an active workstation session and a user prompt or routed CTA, the request is ready to be normalized into governed work.
  when: When the session receives the prompt and binds it to the active context,
  then: Then a semantic request is recorded and prepared for route resolution without losing session attribution.
  thenAssertions:
  - A semantic request record exists for the new prompt.
  - The request is linked to the current workstation session.
  relatedObjectIds:
  - object.semantic-request
  - object.workstation-session
  relatedInteractionIds:
  - interaction.route-chat-request
  relatedInvariantIds:
  - invariant.every-material-action-is-attributable
  expectedUserVisibleOutcome: The user sees the prompt accepted as the next unit of governed work.
  status: active
  stateTransitions:
  - objectId: object.semantic-request
    toState: received
    fromState: fulfilled
  - objectId: object.controller-run
    toState: created
    fromState: completed
- stepId: step.chat-resolve-route
  journeyId: journey.chat-route-governed-work
  sequence: 2
  title: Resolve governed route
  given: Given a captured semantic request and the current session context, the product can compare the request against shell routes, workflows, and governed skills.
  when: When route resolution classifies the request into a governed path,
  then: Then the chosen route identifies the next authoritative surface or execution engine without inventing hidden state.
  thenAssertions:
  - Exactly one governed route or explicit clarification result is chosen.
  - The chosen route names the next surface, skill, or workflow.
  relatedObjectIds:
  - object.semantic-request
  - object.workflow-snapshot
  relatedInteractionIds:
  - interaction.route-chat-request
  relatedInvariantIds:
  - invariant.explicit-open-questions-before-commit
  - invariant.authoritative-snapshot-over-local-ui-state
  expectedUserVisibleOutcome: The user sees the request routed to a meaningful governed surface or clarification need.
  status: active
  stateTransitions:
  - objectId: object.workflow-snapshot
    toState: current
    fromState: stale
- stepId: step.chat-execute-governed-action
  journeyId: journey.chat-route-governed-work
  sequence: 3
  title: Execute governed action
  given: Given a resolved route and any explicit required authority, the product can run controller logic, a skill, a workflow, or a shell transition.
  when: When the routed action executes,
  then: Then the corresponding controller run, skill invocation, or workflow run emits attributable receipts and visible state changes.
  thenAssertions:
  - Executed work yields activity events and any required capability usage records.
  - The resulting workflow snapshot or output reflects the executed route.
  relatedObjectIds:
  - object.controller-run
  - object.activity-event-log
  - object.workflow-snapshot
  relatedInteractionIds:
  - interaction.run-governed-reduction
  - interaction.import-export-and-invoke-skill
  - interaction.compose-and-run-blend-workflow
  relatedInvariantIds:
  - invariant.no-ambient-authority
  - invariant.every-material-action-is-attributable
  expectedUserVisibleOutcome: The user sees the requested work happen or be blocked with an explicit reason.
  status: active
  stateTransitions:
  - objectId: object.controller-run
    toState: running
    fromState: created
  - objectId: object.activity-event-log
    toState: streaming
    fromState: materialized
- stepId: step.chat-return-visible-outcome
  journeyId: journey.chat-route-governed-work
  sequence: 4
  title: Return visible outcome
  given: Given executed routed work and updated authoritative state, the product is ready to present the outcome back to the user.
  when: When the shell returns the governed result to the visible projection,
  then: Then the user sees a final answer, next step, or block reason consistent with the authoritative state and recorded receipts.
  thenAssertions:
  - The visible outcome matches the authoritative workflow snapshot or run result.
  - The user can continue from the returned governed state without refreshing hidden state.
  relatedObjectIds:
  - object.workflow-snapshot
  - object.activity-event-log
  relatedInteractionIds:
  - interaction.inspect-activity-and-history
  - interaction.project-authoritative-workflow-state
  relatedInvariantIds:
  - invariant.authoritative-snapshot-over-local-ui-state
  expectedUserVisibleOutcome: The user sees the next step, final answer, or governed block immediately in the active shell.
  status: active
  stateTransitions:
  - objectId: object.semantic-request
    toState: fulfilled
    fromState: routed
- stepId: step.replay-select-run
  journeyId: journey.replay-export-and-verify-governed-run
  sequence: 1
  title: Select original run
  given: Given a completed controller run and its attributed activity history, the operator can choose that run as the replay source.
  when: When the replay surface binds to the chosen completed run,
  then: Then the product identifies the original run, its receipts, and the material artifacts needed for bundle export.
  thenAssertions:
  - The chosen run is stable and completed.
  - The run has enough recorded material to export a governed bundle.
  relatedObjectIds:
  - object.controller-run
  - object.activity-event-log
  relatedInteractionIds:
  - interaction.inspect-activity-and-history
  relatedInvariantIds:
  - invariant.every-material-action-is-attributable
  expectedUserVisibleOutcome: The user sees the selected run ready for export or replay.
  status: active
  stateTransitions:
  - objectId: object.controller-run
    toState: completed
    fromState: completed
- stepId: step.replay-export-bundle
  journeyId: journey.replay-export-and-verify-governed-run
  sequence: 2
  title: Export run bundle
  given: Given a selected completed run and access to its traces, skills, and artifacts, the bundle exporter can package replay material.
  when: When export runs,
  then: Then a run bundle is emitted with constitutional trace, referenced skills, and comparable receipts.
  thenAssertions:
  - The run bundle contains the original run identity and material replay evidence.
  - The exporter records that a replay bundle now exists for the selected run.
  relatedObjectIds:
  - object.controller-run
  - object.run-bundle
  relatedInteractionIds:
  - interaction.export-and-replay-run-bundle
  relatedInvariantIds:
  - invariant.replay-verification-compares-effects-and-decision-path
  expectedUserVisibleOutcome: The operator sees a bundle ready for replay or archival.
  status: active
  stateTransitions:
  - objectId: object.run-bundle
    toState: exported
    fromState: not-exported
- stepId: step.replay-reconstruct-run
  journeyId: journey.replay-export-and-verify-governed-run
  sequence: 3
  title: Replay bundle
  given: Given an exported run bundle and the required replay policy, the product can reconstruct the governed run for comparison.
  when: When replay executes under the declared policy,
  then: Then a replayed controller run is produced with comparable effect, transcript, and decision-flow material.
  thenAssertions:
  - The replay produces a new run identity rather than mutating the original.
  - The replay carries comparable traces for verification.
  relatedObjectIds:
  - object.run-bundle
  - object.controller-run
  relatedInteractionIds:
  - interaction.export-and-replay-run-bundle
  relatedInvariantIds:
  - invariant.replay-verification-compares-effects-and-decision-path
  expectedUserVisibleOutcome: The operator sees replay verification in progress with attributable diagnostics.
  status: active
  stateTransitions:
  - objectId: object.controller-run
    toState: replayed
    fromState: completed
- stepId: step.replay-classify-match-or-mismatch
  journeyId: journey.replay-export-and-verify-governed-run
  sequence: 4
  title: Classify replay result
  given: Given an original run bundle and a replayed controller run, the verifier can compare constitutional and effect signatures.
  when: When verification finishes,
  then: Then the replay is classified as a match or mismatch with explicit reasons that can guide reimplementation or drift diagnosis.
  thenAssertions:
  - The verifier reports either a stable match or a named mismatch category.
  - Replay results are added to the activity history.
  relatedObjectIds:
  - object.run-bundle
  - object.controller-run
  - object.activity-event-log
  relatedInteractionIds:
  - interaction.export-and-replay-run-bundle
  - interaction.inspect-activity-and-history
  relatedInvariantIds:
  - invariant.replay-verification-compares-effects-and-decision-path
  expectedUserVisibleOutcome: The operator sees whether the replay preserved the same governed path and effects.
  status: active
  stateTransitions:
  - objectId: object.run-bundle
    toState: verified
    fromState: replayed
- stepId: step.gather-stage-or-open-source
  journeyId: journey.gather-capture-and-maintain-subject-context
  sequence: 1
  title: Stage or open source
  given: Given a chosen markdown file, URL-derived capture, or maintained subject entry, the gather flow can stage or open the source material.
  when: When the source is staged or opened through the gather workflow,
  then: Then a learning source exists and the active shell can orient the user around that material without yet treating it as final truth.
  thenAssertions:
  - A learning source record exists for the selected material.
  - The source can be inspected before final admission.
  relatedObjectIds:
  - object.learning-source
  - object.workflow-snapshot
  - object.maintained-source-set
  relatedInteractionIds:
  - interaction.capture-subject-source
  relatedInvariantIds:
  - invariant.learning-context-precedes-projection
  expectedUserVisibleOutcome: The user sees the selected source or subject ready to activate and inspect.
  status: active
  stateTransitions:
  - objectId: object.learning-source
    toState: staged
    fromState: retired
- stepId: step.gather-activate-or-select-subject
  journeyId: journey.gather-capture-and-maintain-subject-context
  sequence: 2
  title: Activate or select subject
  given: Given staged source material or an existing subject entry, the operator can choose the active subject that will own the maintained source set.
  when: When the subject is activated or created,
  then: Then the workflow binds subsequent maintained-file work to one authoritative subject context.
  thenAssertions:
  - Exactly one active subject context is targeted by the gather flow.
  - The active subject is visible in the authoritative workflow snapshot.
  relatedObjectIds:
  - object.subject-context
  - object.workflow-snapshot
  relatedInteractionIds:
  - interaction.capture-subject-source
  - interaction.project-authoritative-workflow-state
  relatedInvariantIds:
  - invariant.authoritative-snapshot-over-local-ui-state
  expectedUserVisibleOutcome: The user sees the active subject name and gather actions for that subject.
  status: active
  stateTransitions:
  - objectId: object.subject-context
    toState: active
    fromState: created
- stepId: step.gather-compare-and-admit-maintained-state
  journeyId: journey.gather-capture-and-maintain-subject-context
  sequence: 3
  title: Compare maintained files and imports
  given: Given an active subject and staged source set, the product can compare maintained files against current subject truth and explicit imports.
  when: When comparison and admission run,
  then: Then learning deltas and subject imports are updated explicitly, and stale maintained state blocks downstream tabs until resolved.
  thenAssertions:
  - Any maintained-file change is expressed as an explicit delta or import update.
  - If the comparison leaves the subject stale, downstream gates remain blocked.
  relatedObjectIds:
  - object.subject-context
  - object.learning-delta
  - object.subject-import
  - object.maintained-source-set
  - object.subject-reasoning-scope
  relatedInteractionIds:
  - interaction.compare-maintained-files-and-manage-imports
  relatedInvariantIds:
  - invariant.stale-maintained-state-blocks-downstream-actions
  - invariant.subject-imports-are-explicit-reviewed-and-usage-scoped
  expectedUserVisibleOutcome: The user sees whether the subject is current, stale, or waiting on import review.
  status: active
  stateTransitions:
  - objectId: object.learning-delta
    toState: applied
    fromState: computed
  - objectId: object.subject-import
    toState: applied
    fromState: approved
- stepId: step.gather-persist-subject-context
  journeyId: journey.gather-capture-and-maintain-subject-context
  sequence: 4
  title: Persist current subject context
  given: Given admitted sources, deltas, and import outcomes, the product can persist the current subject truth as the canonical LearningContext.
  when: When the workflow persists the updated subject context,
  then: Then LearningContext becomes the authoritative base for itemization, draft, review, and publication.
  thenAssertions:
  - The active LearningContext includes the admitted units and source links.
  - Downstream projections consume this authoritative subject truth rather than ad hoc local state.
  relatedObjectIds:
  - object.subject-context
  - object.learning-unit
  - object.workflow-snapshot
  - object.maintained-source-set
  - object.subject-reasoning-scope
  relatedInteractionIds:
  - interaction.project-authoritative-workflow-state
  relatedInvariantIds:
  - invariant.learning-context-precedes-projection
  expectedUserVisibleOutcome: The user sees Gather complete with current subject truth available for downstream phases.
  status: active
  stateTransitions:
  - objectId: object.subject-context
    toState: active
    fromState: stale
  - objectId: object.workflow-snapshot
    toState: current
    fromState: stale
- stepId: step.itemize-generate-session
  journeyId: journey.itemize-generate-and-curate-inventory
  sequence: 1
  title: Generate itemization session
  given: Given a current LearningContext, the product has enough subject truth to derive a candidate inventory.
  when: When itemization generation runs,
  then: Then a fresh itemization session and itemized subject items are produced for the active subject snapshot.
  thenAssertions:
  - A current itemization session exists.
  - The number and kinds of derived items are inspectable.
  relatedObjectIds:
  - object.subject-context
  - object.itemization-session
  - object.itemized-subject-item
  relatedInteractionIds:
  - interaction.generate-itemization
  relatedInvariantIds:
  - invariant.learning-context-precedes-projection
  expectedUserVisibleOutcome: The user sees item inventory rows and itemization status for the active subject.
  status: active
  stateTransitions:
  - objectId: object.itemization-session
    toState: current
    fromState: not-started
- stepId: step.itemize-orient-selected-item
  journeyId: journey.itemize-generate-and-curate-inventory
  sequence: 2
  title: Orient selected item
  given: Given a current itemization session, the operator can move the itemization cursor and inspect a specific candidate item.
  when: When the selected item changes,
  then: Then Item Detail and current-step guidance explain the row kind, confidence, and next recommended curation action.
  thenAssertions:
  - Selection is authoritative and reflected in both inventory and detail panes.
  - The current step describes the selected item rather than stale row state.
  relatedObjectIds:
  - object.itemized-subject-item
  - object.workflow-snapshot
  relatedInteractionIds:
  - interaction.project-authoritative-workflow-state
  relatedInvariantIds:
  - invariant.authoritative-snapshot-over-local-ui-state
  expectedUserVisibleOutcome: The user sees detail for the currently selected item without stale lag or mismatched row state.
  status: active
  stateTransitions:
  - objectId: object.workflow-snapshot
    toState: current
    fromState: current
- stepId: step.itemize-curate-or-hold-item
  journeyId: journey.itemize-generate-and-curate-inventory
  sequence: 3
  title: Curate or hold item
  given: Given a selected itemized subject item, the operator can promote, reject, or hold it for later merge handling.
  when: When a curation action is applied,
  then: Then the item state changes explicitly and the updated status is visible in inventory, detail, and current-step guidance.
  thenAssertions:
  - The curated item state is explicit and attributable.
  - The curation action does not silently affect other rows.
  relatedObjectIds:
  - object.itemized-subject-item
