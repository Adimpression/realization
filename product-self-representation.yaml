schemaVersion: 2.0.1
modelId: model.realized-product-self-representation
modelName: Realized Product Self-Representation
modelPurpose: 'This model captures the externally meaningful semantics of the Realized product so that another team could reimplement the same product in a different stack without having to infer its obligations from the current Python, Textual, Flutter, gRPC, or validation code. It describes the product in domain-first terms: the real-world objects it maintains, the interactions it supports, the invariants it must protect, the user-visible duties and journeys it exposes, the measurable experience envelope for those journeys, and the golden and anti-golden traces that anchor the model to concrete behavior.'
createdAt: '2026-05-16T00:00:00Z'
updatedAt: '2026-05-16T00:00:00Z'
product:
  productId: product.realized-governed-workstation
  name: Realized
  description: A governed realization platform and workstation for subject truth, decision analysis, publication, skills, workflows, and replayable evidence.
  domain: Governed realization, subject-centric research and publication, and explicit host-mediated automation.
lexicon:
- termId: term.realized
  term: Realized
  definition: A governed realization platform whose product surface combines a controller runtime, a host-owned workstation, subject workflow projections, governed skills, workflow execution, and replayable evidence.
  allowedAliases:
  - realized platform
  forbiddenAliases:
  - task app
  - note-taking app
  examples:
  - Realized can ingest subject sources, build report plans, execute publication builds, and preserve attributable traces.
- termId: term.reduce-not
  term: reduce_not
  definition: The controller operation that reduces a structured not-yet-realized state toward justified realization through governed decomposition, evidence, and explicit effects.
  allowedAliases:
  - controller reduction
  forbiddenAliases:
  - just ask model
  examples:
  - The runtime reduces a request into durable steps, effects, and receipts rather than returning an ungoverned answer.
- termId: term.workstation-session
  term: Workstation Session
  definition: A host-owned runtime boundary that binds a root path, attachments, capabilities, initial task contract, and projection surfaces for chat, subject workflow, permissions, activity, and skills.
  allowedAliases:
  - session
  forbiddenAliases:
  - browser tab state
  examples:
  - A workstation session controls which capabilities may be exercised while a user works through subject and publication flows.
- termId: term.learning-context
  term: LearningContext
  definition: The canonical subject truth assembled from admitted sources, derived units, deltas, and explicit governance status; downstream itemization and publication are projections over this context.
  allowedAliases:
  - subject context
  - subject truth
  forbiddenAliases:
  - report plan
  examples:
  - A LearningContext for Smart City Travel stores learned units and source links before any report is built.
- termId: term.learning-unit
  term: Learning Unit
  definition: A normalized subject-semantic unit with stable identity, statement, aliases, provenance, and structured fields that can be reasoned over independently of the source file layout.
  allowedAliases:
  - unit
  forbiddenAliases:
  - paragraph
  examples:
  - One learning unit may state that a city transit authority wants to modernize fare payment.
- termId: term.learning-delta
  term: Learning Delta
  definition: A proposed subject update that carries evidence, rationale, unit additions or deprecations, and explicit operations before those changes are treated as current truth.
  allowedAliases:
  - delta
  forbiddenAliases:
  - git diff
  examples:
  - Applying a maintained-file comparison can produce a learning delta that updates the active subject.
- termId: term.subject-import
  term: Subject Import
  definition: An explicit reviewed import from one subject into another, including imported units and scoped downstream usage, rather than ambient cross-subject retrieval.
  allowedAliases:
  - import
  forbiddenAliases:
  - search result
  examples:
  - A publication composition can include an approved subject import and then decide how each imported unit is used.
- termId: term.itemization-session
  term: Itemization Session
  definition: A snapshot-indexed inventory generation over the current LearningContext that produces itemized subject items for downstream curation.
  allowedAliases:
  - itemization
  forbiddenAliases:
  - draft
  examples:
  - Generating itemization turns subject truth into candidate items with kinds and confidence.
- termId: term.review-composition
  term: Review Composition
  definition: The curated tree of review items rooted in an itemization snapshot, including inclusion state, ordering, and transform receipts for downstream decision analysis and review.
  allowedAliases:
  - draft composition
  - draft
  forbiddenAliases:
  - final publication
  examples:
  - Refreshing the review composition updates the draft item inventory that the user edits in Draft.
- termId: term.decision-frame
  term: Decision Frame
  definition: A DST-backed decision-analysis structure tied to a publication/report question, current and target states, objectives, and scoped decision review items.
  allowedAliases:
  - decision analysis
  forbiddenAliases:
  - report plan
  examples:
  - Running decision analysis evaluates the decision frame before Review may approve the plan.
- termId: term.publication-composition
  term: Publication Composition
  definition: The approved report-plan projection that selects units, sections, imports, and usage policy from LearningContext and review composition before rendering.
  allowedAliases:
  - report plan
  - publication plan
  forbiddenAliases:
  - render artifact
  examples:
  - Review approves a publication composition before Publication can lock inputs and build artifacts.
- termId: term.publication-build
  term: Publication Build
  definition: A deterministic render execution over a locked publication composition and learning-context snapshot that yields typed artifacts and validation results.
  allowedAliases:
  - build
  forbiddenAliases:
  - preview action
  examples:
  - Build Report produces a publication build with render artifacts such as report.pdf and report.md.
- termId: term.render-artifact
  term: Render Artifact
  definition: A built output file associated with a publication build, identified by format, path, and content hash for preview and inspection.
  allowedAliases:
  - artifact
  forbiddenAliases:
  - source file
  examples:
  - Preview report.pdf opens a render artifact produced by the current publication build.
- termId: term.capability-grant
  term: Capability Grant
  definition: An explicit session-scoped authority to exercise a host-mediated action such as reading files, running a process, invoking a skill, or making an HTTP request.
  allowedAliases:
  - grant
  - permission
  forbiddenAliases:
  - role
  examples:
  - The permissions panel grants ws.net.http before a workflow may call a remote endpoint.
- termId: term.governed-skill
  term: Governed Skill
  definition: A declaration-first artifact with schema, lifecycle, runtime package, permissions, and executable behavior that may be imported, exported, composed, and invoked under explicit authority.
  allowedAliases:
  - skill
  forbiddenAliases:
  - plugin
  examples:
  - A governed skill can expose a parameterized function and request specific capabilities before invocation.
- termId: term.blend-workflow
  term: Blend Workflow
  definition: A composed workflow plan whose steps bind operators, inputs, and world mounts into a run that can emit graph, execution receipts, and outputs under governance.
  allowedAliases:
  - workflow
  forbiddenAliases:
  - ad hoc script
  examples:
  - A Blend workflow run can compose several governed skills and execute them with explicit bindings.
- termId: term.run-bundle
  term: Run Bundle
  definition: A replay-oriented export of a governed run that preserves prompts, grants, traces, artifacts, and other receipts so the run can later be reconstructed and compared.
  allowedAliases:
  - bundle
  - replay bundle
  forbiddenAliases:
  - log archive
  examples:
  - Exporting a run bundle allows a later replay verification to compare effect signatures and decision flow.
- termId: term.authoritative-snapshot
  term: Authoritative Snapshot
  definition: The server-computed workflow state, control bundle, and pane bundle that all projections must render rather than inventing local semantic state.
  allowedAliases:
  - snapshot
  - workflow snapshot
  forbiddenAliases:
  - frontend cache truth
  examples:
  - Flutter and Textual both watch the authoritative snapshot when rendering Gather through Publication.
- termId: term.activity-event
  term: Activity Event
  definition: A durable attributed event or receipt emitted by governed work, used for the Activity surface, history inspection, and replay diagnosis.
  allowedAliases:
  - activity entry
  - receipt
  forbiddenAliases:
  - console log
  examples:
  - An activity event can link a build action to the resulting artifact and the capability grants exercised.
- termId: term.release-review
  term: Release Review
  definition: The post-build inspection phase in which built artifacts are previewed, the release folder may be inspected, and sign-off can be completed.
  allowedAliases:
  - release sign-off
  forbiddenAliases:
  - build itself
  examples:
  - After a report build completes, Release Review confirms the built outputs are ready for inspection and sign-off.
- termId: term.source-set
  term: Source Set
  definition: The staged or maintained collection of learning sources currently selected for comparison and admission into an active subject.
  allowedAliases:
  - maintained files set
  - staged source set
  forbiddenAliases:
  - folder
  examples:
  - Gather exposes the current source set before maintained-file comparison is applied.
- termId: term.reasoning-scope
  term: Reasoning Scope
  definition: The explicit bounded set of active subject truth plus approved imported subject material that downstream reasoning and publication may use.
  allowedAliases:
  - bounded reasoning scope
  forbiddenAliases:
  - global retrieval
  examples:
  - Publication status shows the current reasoning scope and whether imported support is available.
ambiguityPolicy:
  principle: When the current codebase or runtime behavior leaves a materially meaningful question unresolved, the product model must prefer explicit clarification or explicit risk over smoothing the ambiguity into language that sounds precise but hides the gap.
  unresolvedQuestionHandling: record-open-question
  requiresClarificationWhen:
  - A route, approval, or build path would change user-visible semantics if interpreted either way.
  - A capability or import boundary would become ambient unless the missing distinction is made explicit.
  - A replay or build claim would no longer be reproducible from durable evidence alone.
realWorldModel:
  objects:
  - objectId: object.semantic-request
    name: Semantic Request
    definition: A user-originated request or routed command that names the work to be reduced, delegated, or projected through the product.
    lifecycleStates:
    - received
    - routed
    - fulfilled
    - blocked
    - failed
    ownedByDutyIds:
    - duty.route-chat-work
  - objectId: object.workstation-session
    name: Workstation Session
    definition: The runtime shell boundary that owns attachments, capabilities, chat/task context, projection subscribers, and retryable governed work.
    lifecycleStates:
    - bootstrapped
    - active
    - waiting-for-approval
    - closed
    ownedByDutyIds:
    - duty.govern-session-capabilities
    - duty.route-chat-work
  - objectId: object.capability-grant
    name: Capability Grant
    definition: An explicit authority record granting a named workstation or host capability to a session or invocation path.
    lifecycleStates:
    - pending
    - granted
    - revoked
    - expired
    ownedByDutyIds:
    - duty.govern-session-capabilities
    - duty.manage-skills-and-workflows
  - objectId: object.activity-event-log
    name: Activity Event Log
    definition: The attributable stream of events, receipts, approvals, and outcomes emitted by governed product work.
    lifecycleStates:
    - empty
    - streaming
    - materialized
    - archived
    ownedByDutyIds:
    - duty.inspect-activity-history
    - duty.replay-governed-runs
  - objectId: object.controller-run
    name: Controller Run
    definition: A governed reduction run with prompt ingress, semantic development, effect traces, receipts, and final answer surface.
    lifecycleStates:
    - created
    - running
    - completed
    - replayed
    - mismatched
    ownedByDutyIds:
    - duty.route-chat-work
    - duty.replay-governed-runs
  - objectId: object.run-bundle
    name: Run Bundle
    definition: A portable replay package containing run state, referenced skills, constitutional traces, and comparable receipts.
    lifecycleStates:
    - not-exported
    - exported
    - replayed
    - verified
    - mismatched
    ownedByDutyIds:
    - duty.replay-governed-runs
  - objectId: object.workflow-snapshot
    name: Workflow Snapshot
    definition: The authoritative projected state that exposes tabs, controls, panes, actions, and current-step guidance for a session or subject workflow.
    lifecycleStates:
    - current
    - stale
    - replaced
    ownedByDutyIds:
    - duty.route-chat-work
    - duty.capture-subject-knowledge
  - objectId: object.subject-context
    name: Subject Context
    definition: The canonical semantic representation of one subject, including summary, units, aliases, sources, deltas, and governance state.
    lifecycleStates:
    - created
    - active
    - stale
    - superseded
    ownedByDutyIds:
    - duty.capture-subject-knowledge
  - objectId: object.learning-source
    name: Learning Source
    definition: An admitted or staged source artifact such as markdown, URL-derived capture, or imported body that contributes evidence to a subject.
    lifecycleStates:
    - staged
    - admitted
    - retired
    ownedByDutyIds:
    - duty.capture-subject-knowledge
  - objectId: object.maintained-source-set
    name: Maintained Source Set
    definition: The currently selected staged or maintained collection of sources that Gather compares against the active subject before downstream work may proceed.
    lifecycleStates:
    - selected
    - compared
    - current
    - stale
    ownedByDutyIds:
    - duty.capture-subject-knowledge
  - objectId: object.learning-unit
    name: Learning Unit
    definition: A normalized subject fact or unit of meaning with provenance, structured fields, and stable identity.
    lifecycleStates:
    - proposed
    - current
    - deprecated
    ownedByDutyIds:
    - duty.capture-subject-knowledge
    - duty.itemize-subject-inventory
  - objectId: object.learning-delta
    name: Learning Delta
    definition: A change proposal over subject truth that records why and how the LearningContext should evolve.
    lifecycleStates:
    - computed
    - applied
    - rejected
    - stale
    ownedByDutyIds:
    - duty.capture-subject-knowledge
  - objectId: object.subject-import
    name: Subject Import
    definition: An explicit reviewed import record that carries units or related subject material into the active subject or report plan.
    lifecycleStates:
    - proposed
    - approved
    - rejected
    - retired
    - applied
    ownedByDutyIds:
    - duty.capture-subject-knowledge
    - duty.approve-report-scope
  - objectId: object.subject-reasoning-scope
    name: Subject Reasoning Scope
    definition: The explicit bounded reasoning surface for an active subject, including the active subject version and any approved imported subject material that downstream reasoning may use.
    lifecycleStates:
    - local-only
    - import-bounded
    - current
    - stale
    ownedByDutyIds:
    - duty.capture-subject-knowledge
    - duty.approve-report-scope
    - duty.build-publication-release
  - objectId: object.itemization-session
    name: Itemization Session
    definition: The indexed inventory build over a subject snapshot that yields itemized subject items.
    lifecycleStates:
    - not-started
    - current
    - stale
    - failed
    ownedByDutyIds:
    - duty.itemize-subject-inventory
  - objectId: object.itemized-subject-item
    name: Itemized Subject Item
    definition: A candidate claim, question, definition, or other semantic item derived from LearningContext for downstream curation.
    lifecycleStates:
    - candidate
    - promoted
    - rejected
    - held
    ownedByDutyIds:
    - duty.itemize-subject-inventory
    - duty.compose-review-structure
  - objectId: object.review-composition
    name: Review Composition
    definition: The review tree built from itemized items, including inclusion state, ordering, transform mode, and split/merge structure.
    lifecycleStates:
    - empty
    - draft-current
    - stale
    - approved-basis
    ownedByDutyIds:
    - duty.compose-review-structure
    - duty.curate-decision-analysis
  - objectId: object.review-item
    name: Review Item
    definition: One curated node inside the review composition with semantic kind, render mode, evidence mode, and child ordering.
    lifecycleStates:
    - selected
    - included
    - excluded
    - split
    - merged
    ownedByDutyIds:
    - duty.compose-review-structure
    - duty.curate-decision-analysis
  - objectId: object.decision-frame
    name: Decision Frame
    definition: The current decision-analysis frame describing the report question, state transitions, objectives, and scoped items.
    lifecycleStates:
    - not-created
    - current
    - blocked
    - analyzed
    - stale
    ownedByDutyIds:
    - duty.curate-decision-analysis
  - objectId: object.decision-review-item
    name: Decision Review Item
    definition: A decision-scoped view of one review item with decision role, inclusion, ordering, and child relations.
    lifecycleStates:
    - recommended
    - included
    - excluded
    - blocked
    ownedByDutyIds:
    - duty.curate-decision-analysis
  - objectId: object.publication-composition
    name: Publication Composition
    definition: The report-plan composition selecting sections, included units, import usage, and support for approval and build.
    lifecycleStates:
    - not-created
    - draft
    - approved
    - locked
    ownedByDutyIds:
    - duty.approve-report-scope
    - duty.build-publication-release
  - objectId: object.publication
    name: Publication
    definition: The publication aggregate for one subject and type, tying composition, claims, blocks, sections, builds, and review records together.
    lifecycleStates:
    - draft
    - approved
    - built
    - released
    ownedByDutyIds:
    - duty.build-publication-release
  - objectId: object.publication-build
    name: Publication Build
    definition: The renderer execution over locked publication inputs that records validation, renderer identity, and produced artifacts.
    lifecycleStates:
    - queued
    - running
    - ok
    - failed
    ownedByDutyIds:
    - duty.build-publication-release
  - objectId: object.render-artifact
    name: Render Artifact
    definition: A typed output file such as PDF, Markdown, or intermediate artifact emitted by a publication build.
    lifecycleStates:
    - created
    - previewed
    - released
    ownedByDutyIds:
    - duty.build-publication-release
  - objectId: object.release-review
    name: Release Review
    definition: The inspection and sign-off state over built artifacts and release folder contents after a publication build.
    lifecycleStates:
    - pending
    - in-review
    - signed-off
    ownedByDutyIds:
    - duty.build-publication-release
  - objectId: object.governed-skill
    name: Governed Skill
    definition: A cataloged governed skill artifact with declaration, permissions, runtime package reference, and lifecycle metadata.
    lifecycleStates:
    - cataloged
    - imported
    - invoked
    - exported
    - deprecated
    ownedByDutyIds:
    - duty.manage-skills-and-workflows
  - objectId: object.blend-workflow-plan
    name: Blend Workflow Plan
    definition: A composed workflow plan made of steps, bindings, conditions, and world mounts.
    lifecycleStates:
    - draft
    - bound
    - ready
    - retired
    ownedByDutyIds:
    - duty.manage-skills-and-workflows
  - objectId: object.blend-workflow-run
    name: Blend Workflow Run
    definition: An executed workflow instance with step receipts, graph, outputs, and halts or completions.
    lifecycleStates:
    - started
    - halted
    - completed
    - failed
    ownedByDutyIds:
    - duty.manage-skills-and-workflows
  interactions:
  - interactionId: interaction.route-chat-request
    name: Route Chat Request
    description: Interpret a chat prompt or routed CTA, determine the governed route, and bind the session to the next governed work surface or execution path.
    participantObjectIds:
    - object.semantic-request
    - object.workstation-session
    - object.workflow-snapshot
    expectedRealWorldDuration:
      class: under-1s
      explanation: Route selection is expected to feel immediate because it is part of an interactive workstation conversation.
  - interactionId: interaction.run-governed-reduction
    name: Run Governed Reduction
    description: Execute controller reduction, optionally with hosted LLM supplementation, while preserving explicit prompts, receipts, and effect traces.
    participantObjectIds:
    - object.semantic-request
    - object.controller-run
    - object.activity-event-log
    expectedRealWorldDuration:
      class: mixed
      explanation: Some reductions are local and fast, while LLM-supplemented or multi-step reductions legitimately take longer than one second.
  - interactionId: interaction.export-and-replay-run-bundle
    name: Export and Replay Run Bundle
    description: Export a bundle for a completed run and later reconstruct and compare a replayed run against the original constitutional and effect traces.
    participantObjectIds:
    - object.controller-run
    - object.run-bundle
    - object.activity-event-log
    expectedRealWorldDuration:
      class: over-or-equal-1s
      explanation: Bundle export and replay verification are inspection and governance actions whose real-world value is correctness, not instant response.
  - interactionId: interaction.project-authoritative-workflow-state
    name: Project Authoritative Workflow State
    description: Compute and stream the authoritative subject or workstation workflow snapshot, control bundle, and pane bundle to one or more UI projections.
    participantObjectIds:
    - object.workstation-session
    - object.workflow-snapshot
    - object.subject-context
    expectedRealWorldDuration:
      class: under-1s
      explanation: Projection refresh follows direct user actions and must support read-your-writes interaction across tabs and panes.
  - interactionId: interaction.capture-subject-source
    name: Capture Subject Source
    description: Stage or admit markdown, URL-derived, or imported material into subject-oriented source and unit structures.
    participantObjectIds:
    - object.subject-context
    - object.learning-source
    - object.learning-unit
    expectedRealWorldDuration:
      class: mixed
      explanation: Opening a local file is immediate, but parsing, normalization, and derivative learning work can take longer.
  - interactionId: interaction.compare-maintained-files-and-manage-imports
    name: Compare Maintained Files and Manage Imports
    description: Compare maintained files against current subject truth, apply deltas, and create or update explicit subject imports when other subjects are pulled in.
    participantObjectIds:
    - object.subject-context
    - object.learning-delta
    - object.subject-import
    - object.maintained-source-set
    - object.subject-reasoning-scope
    expectedRealWorldDuration:
      class: over-or-equal-1s
      explanation: Comparison, admission, and import review can involve non-trivial semantic diffing and should be allowed to complete asynchronously.
  - interactionId: interaction.generate-itemization
    name: Generate Itemization
    description: Produce a fresh itemization session and navigate the user through item candidate orientation and promotion or rejection.
    participantObjectIds:
    - object.subject-context
    - object.itemization-session
    - object.itemized-subject-item
    expectedRealWorldDuration:
      class: over-or-equal-1s
      explanation: Inventory generation over a subject snapshot is meaningful work and may take longer than one second.
  - interactionId: interaction.compose-review-structure
    name: Compose Review Structure
    description: Create or refresh the review composition, preserve selection state, and expose transform controls over review items.
    participantObjectIds:
    - object.itemized-subject-item
    - object.review-composition
    - object.review-item
    expectedRealWorldDuration:
      class: over-or-equal-1s
      explanation: Draft composition generation and restructure steps are substantial enough to justify asynchronous completion.
  - interactionId: interaction.run-decision-analysis
    name: Run Decision Analysis
    description: Create, refresh, or analyze a decision frame over draft items and record whether the frame is current, blocked, or recommendable.
    participantObjectIds:
    - object.review-composition
    - object.decision-frame
    - object.decision-review-item
    expectedRealWorldDuration:
      class: over-or-equal-1s
      explanation: Decision analysis is explicitly a deeper transformation step whose latency is acceptable when clearly surfaced to the user.
  - interactionId: interaction.approve-report-plan
    name: Approve Report Plan
    description: Inspect the report plan, adjust import usage and section inclusion, preview diffs, and approve the current publication composition for release.
    participantObjectIds:
    - object.publication-composition
    - object.subject-import
    - object.review-item
    - object.subject-reasoning-scope
    expectedRealWorldDuration:
      class: mixed
      explanation: Scope inspection is interactive, but preview and plan recomputation can take more than one second.
  - interactionId: interaction.build-publication
    name: Build Publication
    description: Lock approved publication inputs, render the publication, validate the outputs, and persist build records and render artifacts.
    participantObjectIds:
    - object.publication-composition
    - object.publication-build
    - object.render-artifact
    - object.subject-reasoning-scope
    expectedRealWorldDuration:
      class: over-or-equal-1s
      explanation: Artifact rendering is a build process and is naturally slower than direct interaction.
  - interactionId: interaction.preview-publication-artifact
    name: Preview Publication Artifact
    description: Open or preview a supported built artifact and transition into release review without mutating the authoritative publication semantics.
    participantObjectIds:
    - object.render-artifact
    - object.release-review
    - object.workflow-snapshot
    expectedRealWorldDuration:
      class: mixed
      explanation: Preview dispatch is interactive, but the browser or artifact host may resolve the target on a separate timeline.
  - interactionId: interaction.change-session-capabilities
    name: Change Session Capabilities
    description: List current session permissions, grant or revoke capability entries, and immediately retry blocked governed work when the new authority allows it.
    participantObjectIds:
    - object.workstation-session
    - object.capability-grant
    - object.activity-event-log
    expectedRealWorldDuration:
      class: under-1s
      explanation: Permission changes are direct operator actions and must feel immediate so blocked work can be retried predictably.
  - interactionId: interaction.import-export-and-invoke-skill
    name: Import, Export, and Invoke Skill
    description: Catalog skills, import or export governed skill artifacts, inspect requested permissions, and invoke skills with explicit inputs.
    participantObjectIds:
    - object.governed-skill
    - object.capability-grant
    - object.activity-event-log
    expectedRealWorldDuration:
      class: mixed
      explanation: Catalog inspection is fast, while invocation or import/export may run processes or remote package work.
  - interactionId: interaction.compose-and-run-blend-workflow
    name: Compose and Run Blend Workflow
    description: Select or compose a workflow plan, bind operators and inputs, and execute a workflow run with emitted graph and receipts.
    participantObjectIds:
    - object.blend-workflow-plan
    - object.blend-workflow-run
    - object.governed-skill
    expectedRealWorldDuration:
      class: mixed
      explanation: Workflow planning is interactive, but executing a composed plan can legitimately take longer than one second.
  - interactionId: interaction.inspect-activity-and-history
    name: Inspect Activity and History
    description: Subscribe to the activity feed, inspect related receipts, and use history or builds to diagnose prior governed work.
    participantObjectIds:
    - object.activity-event-log
    - object.controller-run
    - object.publication-build
    expectedRealWorldDuration:
      class: under-1s
      explanation: Historical inspection should respond quickly once the relevant records already exist.
  - interactionId: interaction.perform-network-request
    name: Perform Network Request
    description: Use explicitly granted HTTP authority to communicate with a remote system or fetch network data as part of governed workstation work.
    participantObjectIds:
    - object.workstation-session
    - object.capability-grant
    - object.activity-event-log
    expectedRealWorldDuration:
      class: over-or-equal-1s
      explanation: External communication is inherently variable and should be modeled as a slower, separable real-world process.
  invariants:
  - invariantId: invariant.explicit-open-questions-before-commit
    name: Explicit open questions before commit
    statement: The product must not silently commit to a route or semantic change when clarifying information is still materially unresolved.
    rationale: Governed reduction is only trustworthy if ambiguity becomes explicit rather than hidden inside a convenient guess.
    severity: critical
    objectIds:
    - object.semantic-request
