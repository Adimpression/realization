- journeyId: journey.replay-export-and-verify-governed-run
  dutyId: duty.replay-governed-runs
  title: Export and verify a governed run bundle
  description: A completed governed run is exported as a bundle and replayed later so the product can compare decision flow, effects, and attributable receipts.
  purpose: Make realized work inspectable and reimplementable by preserving enough evidence to replay and compare the original governed path.
  trigger: An operator chooses to export or replay a governed run.
  preconditions:
  - A completed controller run exists with attributable receipts.
  - The referenced skills or artifacts needed for replay are available or bundled.
  primaryFlow:
  - Select the completed run and gather its governed receipts.
  - Export a run bundle with traces, skills, and artifacts.
  - Replay the bundle under the appropriate determinism policy.
  - Classify the replay as match or mismatch and expose diagnostics.
  completionCriteria:
  - A run bundle exists for the original run.
  - Replay verification reports match or specific mismatch categories with evidence.
  variants:
  - The replay consumes recorded LLM transcript data instead of live provider calls.
  - The replay is used for drift diagnosis rather than success confirmation.
  failureBoundaries:
  - If required bundled dependencies are missing, replay must fail explicitly rather than silently degrading.
  - If decision flow or effect signatures differ, the product must surface the mismatch class.
  nonGoals:
