schema_version = 1

[secret_scanner]
name = "gitleaks"
module = "github.com/zricethezav/gitleaks/v8"
version = "8.30.1"
install = "GOBIN=/tmp/realization-tools go install github.com/zricethezav/gitleaks/v8@v8.30.1"
history_command = "gitleaks git --no-banner --redact=100 --report-format json --report-path /tmp/realization-gitleaks-history.json ."
stage_command = "gitleaks dir --no-banner --redact=100 --report-format json --report-path /tmp/realization-gitleaks-stage.json /tmp/realization-release"
