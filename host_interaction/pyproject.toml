[project]
name = "realized-host-interaction"
version = "0.1.0"
description = "Backend-neutral host-interaction contracts, bounded actions, delegation, and receipts for Realization."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Ravindranath Akila" }]
maintainers = [{ name = "Adimpression", email = "talktome@adimpression.mobi" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["governance", "host", "capabilities", "delegation", "receipts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Adimpression/realization"
Repository = "https://github.com/Adimpression/realization"
Issues = "https://github.com/Adimpression/realization/issues"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["realized_host_interaction"]

[tool.setuptools.package-data]
realized_host_interaction = ["py.typed"]
