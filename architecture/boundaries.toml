[components.grpc_implementation]
project_dir = "workstation/grpc_implementation"
distribution = "realized-workstation-grpc-implementation"
module_prefix = "workstation.grpc.implementation"
layer = "exchange_adapters"
allowed_dependencies = [
  "contracts",
  "foundation_events",
  "foundation_models",
  "grpc_definitions",
  "runtime_core",
  "shell_core",
  "subject_core",
  "subject_service",
