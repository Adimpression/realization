schema_version = 1
workspace_globs = [
  "blend/pyproject.toml",
  "blend_application/pyproject.toml",
  "coordinated_transformation/pyproject.toml",
  "core_*/pyproject.toml",
  "host_interaction/pyproject.toml",
  "skill_semantics/pyproject.toml",
  "validation/pyproject.toml",
  "workstation/*/pyproject.toml",
]
baseline_path = "architecture/dependency-baseline.json"
report_path = "architecture/DEPENDENCY_REPORT.md"
compatibility_inventory_path = "architecture/compatibility-facades.json"
compatibility_policy_path = "architecture/compatibility-facade-policy.json"
compatibility_contract_path = "architecture/compatibility-facade-contracts.json"
remaining_obligations_path = "architecture/remaining-architecture-obligations.toml"
root_module_glob = "*.py"
root_package_excludes = ["tests", "workstation"]
exclude_globs = [
  ".venv/**",
  ".uv-cache/**",
  "**/__pycache__/**",
  "**/build/**",
  "**/dist/**",
  "**/generated/**",
  "**/*_pb2.py",
  "**/*_pb2_grpc.py",
  "**/tests/**",
  "reports/**",
  "reconstructed_product_spec/**",
  "tests/**",
]
compatibility_alias_globs = [
  "workstation/compatibility_api/src/workstation/foundation/events/subscriber_controllers.py",
  "workstation/compatibility_api/src/workstation/foundation/host/client_sessions.py",
  "workstation/compatibility_api/src/workstation/foundation/host/learning_capture.py",
  "workstation/compatibility_api/src/workstation/foundation/host/llm_driver.py",
  "workstation/compatibility_api/src/workstation/shell/core/shell_prompt_routing.py",
]

# A dependency with no static import is not an ambient permission. If a future
# plugin or generated boundary requires one, record its source, target, reason,
# and executable evidence here. The checker rejects all other unobserved
# allowances and rejects contracts that become stale after a static import is
# introduced.
dynamic_dependency_contracts = []

[compatibility_retirement]
minimum_stable_qualification_cycles = 1
completed_stable_qualification_cycles = 1
qualification_evidence = "architecture/qualification-baseline.json"

# Root/package boundary classifications are deliberately conservative. Modules
# not listed here are reported as orchestration rather than guessed from their
# names. The classification describes why a package crosses into the legacy
# root graph (or vice versa); it does not declare the edge desirable.
[root_boundary_classification]
default = "orchestration"
pure_helper_modules = []
dto_constant_modules = []
persistence_modules = []
compatibility_modules = []

# Every repository-root Python module has one explicit architectural
# responsibility. This is a target ownership ledger, not permission for the
# module to remain at the root. Orthogonal lifecycle/status metadata follows in
# root_module_status so compatibility facades are still attributed to the
# responsibility whose API they preserve.
[root_module_ownership]
semantic_model = []
portable_skills = []
governance = []
runtime_execution = []
controller = []
llm = []
subject_domain = []
blend = []
entry_exchange = []
persistence_adapter = []
compatibility = []
validation_trial = [
  "SEMANTIC_RELATION_VALIDATION",
  "TRIAL_DOMAIN_VALIDATION",
  "tablet_safety_validation",
  "title_depth_learning_validation",
]

# Status is independent of ownership. A module may have more than one status;
# main.py is both the historical import facade and an executable entrypoint.
[root_module_status]
entrypoint_modules = []
validation_modules = [
  "SEMANTIC_RELATION_VALIDATION",
  "TRIAL_DOMAIN_VALIDATION",
  "tablet_safety_validation",
  "title_depth_learning_validation",
]
compatibility_facade_modules = []

# Top-level Python package families that are not yet UV projects remain part of
# the same ownership and target-direction ratchet as root modules.
[root_package_ownership]
validation_trial = [
  "design",
]

[root_package_status]
validation_packages = [
  "design",
]

# Target responsibility-level dependency direction. Current violations remain
# visible in the generated baseline and may only shrink. The target graph itself
# must remain acyclic.
[root_owner_policy.semantic_model]
allowed_dependencies = []

[root_owner_policy.portable_skills]
allowed_dependencies = ["semantic_model"]

[root_owner_policy.governance]
allowed_dependencies = ["portable_skills", "semantic_model"]

[root_owner_policy.runtime_execution]
allowed_dependencies = ["governance", "portable_skills", "semantic_model"]

[root_owner_policy.llm]
allowed_dependencies = ["semantic_model"]

[root_owner_policy.subject_domain]
allowed_dependencies = [
  "governance",
  "llm",
  "portable_skills",
  "runtime_execution",
  "semantic_model",
]

[root_owner_policy.blend]
allowed_dependencies = [
  "governance",
  "portable_skills",
  "runtime_execution",
  "semantic_model",
]

[root_owner_policy.controller]
allowed_dependencies = [
  "blend",
  "governance",
  "llm",
  "portable_skills",
  "runtime_execution",
  "semantic_model",
]

[root_owner_policy.persistence_adapter]
allowed_dependencies = [
  "blend",
  "governance",
  "portable_skills",
  "semantic_model",
  "subject_domain",
]

[root_owner_policy.entry_exchange]
allowed_dependencies = [
  "blend",
  "controller",
  "governance",
  "llm",
  "persistence_adapter",
  "portable_skills",
  "runtime_execution",
  "semantic_model",
  "subject_domain",
]

[root_owner_policy.compatibility]
allowed_dependencies = [
  "blend",
  "controller",
  "governance",
  "llm",
  "persistence_adapter",
  "portable_skills",
  "runtime_execution",
  "semantic_model",
  "subject_domain",
]

[root_owner_policy.validation_trial]
allowed_dependencies = [
  "blend",
  "compatibility",
  "controller",
  "entry_exchange",
  "governance",
  "llm",
  "persistence_adapter",
  "portable_skills",
  "runtime_execution",
  "semantic_model",
  "subject_domain",
]

