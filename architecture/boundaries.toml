schema_version = 1
workspace_globs = ["core_*/pyproject.toml", "workstation/*/pyproject.toml"]
baseline_path = "architecture/dependency-baseline.json"
report_path = "architecture/DEPENDENCY_REPORT.md"
root_module_glob = "*.py"
exclude_globs = [
  ".venv/**",
  ".uv-cache/**",
  "**/__pycache__/**",
  "**/build/**",
  "**/dist/**",
  "**/generated/**",
  "**/*_pb2.py",
  "**/*_pb2_grpc.py",
  "**/tests/**",
  "reports/**",
  "reconstructed_product_spec/**",
  "tests/**",
]
compatibility_alias_globs = [
  "workstation/foundation_events/src/workstation/foundation/events/subscriber_controllers.py",
  "workstation/foundation_host/src/workstation/foundation/host/client_sessions.py",
  "workstation/foundation_host/src/workstation/foundation/host/llm_driver.py",
  "workstation/shell_core/src/workstation/shell/core/shell_prompt_routing.py",
]

# Root/package boundary classifications are deliberately conservative. Modules
# not listed here are reported as orchestration rather than guessed from their
# names. The classification describes why a package crosses into the legacy
# root graph (or vice versa); it does not declare the edge desirable.
[root_boundary_classification]
default = "orchestration"
pure_helper_modules = [
  "semantic_text",
]
dto_constant_modules = [
  "applied_theory_primitives",
  "applied_theory_types",
  "artifact_contracts",
  "decision_review_models",
  "host_interaction_models",
  "itemize_models",
  "skill_ir",
  "skill_leaf_types",
]
persistence_modules = [
  "blend_operator_store",
  "blend_workflow_store",
  "blend_world_store",
  "store",
]
compatibility_modules = [
  "skill_invocation_contract",
]

# This is the target dependency policy, not a claim that the repository already
# conforms to it. architecture/dependency-baseline.json records the existing
# exceptions and lets the checker reject only new or reintroduced violations.

[components.governed_core]
project_dir = "core_runtime"
distribution = "realized-core-runtime"
module_prefix = "realized_core_runtime"
layer = "core"
allowed_dependencies = []

[components.core_engine]
project_dir = "core_engine"
distribution = "realized-core-engine"
module_prefix = "realized_core_engine"
layer = "controller"
allowed_dependencies = ["governed_core"]

[components.core_app]
project_dir = "core_app"
distribution = "realized-core"
module_prefix = "realized_core"
layer = "entry"
allowed_dependencies = ["core_engine"]

[components.namespace]
project_dir = "workstation/namespace"
distribution = "realized-workstation"
module_prefix = "workstation"
layer = "namespace"
allowed_dependencies = []

[components.contracts]
project_dir = "workstation/contracts_api"
distribution = "realized-workstation-contracts"
module_prefix = "workstation.contracts"
layer = "contracts"
allowed_dependencies = []

[components.foundation_models]
project_dir = "workstation/foundation_models"
distribution = "realized-workstation-foundation-models"
module_prefix = "workstation.foundation.models"
layer = "foundation"
allowed_dependencies = []

[components.foundation_events]
project_dir = "workstation/foundation_events"
distribution = "realized-workstation-foundation-events"
module_prefix = "workstation.foundation.events"
layer = "foundation"
allowed_dependencies = ["contracts", "foundation_models"]

[components.foundation_host]
project_dir = "workstation/foundation_host"
distribution = "realized-workstation-foundation-host"
module_prefix = "workstation.foundation.host"
layer = "foundation"
allowed_dependencies = ["contracts", "foundation_events", "foundation_models"]

[components.foundation_projections]
project_dir = "workstation/foundation_projections"
distribution = "realized-workstation-foundation-projections"
module_prefix = "workstation.foundation.projections"
