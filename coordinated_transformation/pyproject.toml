[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coordinated-transformation"
version = "0.1.0"
description = "Coordinated transformation in federated systems theory"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["coordinated_transformation"]
