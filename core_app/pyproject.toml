[project]
name = "realized-core"
version = "0.1.0"
description = "Narrow command-line application for the Realized governed engine."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Ravindranath Akila" }]
maintainers = [{ name = "Adimpression", email = "talktome@adimpression.mobi" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["governance", "reasoning", "sqlite", "artifacts", "replay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "realized-core-conversation==0.1.0",
    "realized-core-engine==0.1.0",
    "realized-core-llm==0.1.0",
]

[project.urls]
Homepage = "https://github.com/Adimpression/realization"
Repository = "https://github.com/Adimpression/realization"
Issues = "https://github.com/Adimpression/realization/issues"

[project.optional-dependencies]
wasm = ["realized-core-engine[wasm]==0.1.0"]

[project.scripts]
realized-core = "realized_core.cli:main"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["realized_core"]

[tool.uv.sources]
realized-core-conversation = { workspace = true }
realized-core-engine = { workspace = true }
realized-core-llm = { workspace = true }
