[project]
name = "realized-core-conversation"
version = "0.1.0"
description = "Transport-neutral governed conversation application service for Realized."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Ravindranath Akila" }]
maintainers = [{ name = "Adimpression", email = "talktome@adimpression.mobi" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["governance", "conversation", "resumption", "artifacts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "realized-core-engine==0.1.0",
    "realized-core-llm==0.1.0",
]

[project.urls]
Homepage = "https://github.com/Adimpression/realization"
Repository = "https://github.com/Adimpression/realization"
Issues = "https://github.com/Adimpression/realization/issues"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["realized_core_conversation"]

[tool.setuptools.package-data]
realized_core_conversation = ["py.typed"]

[tool.uv.sources]
realized-core-engine = { workspace = true }
realized-core-llm = { workspace = true }
