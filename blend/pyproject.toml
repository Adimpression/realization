[project]
name = "realized-blend"
version = "0.1.0"
description = "Contextual world, operator, session, workflow, history, and coordination contracts for Realized."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Ravindranath Akila" }]
maintainers = [{ name = "Adimpression", email = "talktome@adimpression.mobi" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["workflow", "operators", "context", "coordination", "domain-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["realized-core-semantics==0.1.0"]

[project.urls]
Homepage = "https://github.com/Adimpression/realization"
Repository = "https://github.com/Adimpression/realization"
Issues = "https://github.com/Adimpression/realization/issues"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["realized_blend"]

[tool.setuptools.package-data]
realized_blend = ["py.typed"]

[tool.uv.sources]
realized-core-semantics = { workspace = true }
